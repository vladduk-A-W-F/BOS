name: BoS PLAN-TIME — читання готового evidence
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [fix/p10-002-task-sequence-20260919]
    paths: [.github/workflows/bos-plan-time-evidence-read.yml]
permissions:
  actions: read
  contents: read
jobs:
  read-existing-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'fix/p10-002-task-sequence-20260919' && github.head_ref == 'setup/bos-gpt-orchestration-20260920' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate and read the completed artifact without executing its contents
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO = 'vladduk-A-W-F/BOS'
          RUN = 35513613026
          ARTIFACT = 10606505258
          HEAD = '1876ad00412b558fcfe0f23ab5291c90caeba63a'
          ZIP_SHA = '1fd89539b1fd46fbd27a6b8a79549aad00288519a6ead3b78032749fbb0d53fb'
          ZIP_BYTES = 22338
          WORKFLOW = '.github/workflows/bos-plan-time-evidence-read.yml'
          EXPECTED = {'dependencies.stdout.log', 'dependencies.stderr.log', 'runner-started.json',
                      'report.json', 'django.json', 'django.stdout.log', 'django.stderr.log',
                      'replay.json', 'replay.stdout.log', 'replay.stderr.log', 'sha256-index.json'}
          API = 'https://api.github.com/repos/' + REPO
          HEADERS = {'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          
          def get_json(path):
              request = urllib.request.Request(API + path, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None
          
          def main():
              current = get_json('/commits/' + os.environ['CURRENT_HEAD'])
              if WORKFLOW not in {row['filename'] for row in current['files']}:
                  print('PLAN_TIME_EVIDENCE_SKIPPED current commit does not change the evidence reader')
                  return
              run = get_json('/actions/runs/' + str(RUN))
              assert run['id'] == RUN and run['head_sha'] == HEAD and run['run_attempt'] == 1
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['event'] == 'pull_request'
              metadata = get_json('/actions/artifacts/' + str(ARTIFACT))
              assert metadata['id'] == ARTIFACT and metadata['expired'] is False
              assert metadata['name'] == 'bos-plan-time-targeted-35513613026-1'
              assert metadata['size_in_bytes'] == ZIP_BYTES and metadata['digest'] == 'sha256:' + ZIP_SHA
              assert metadata['workflow_run']['id'] == RUN and metadata['workflow_run']['head_sha'] == HEAD
              request = urllib.request.Request(API + '/actions/artifacts/' + str(ARTIFACT) + '/zip', headers=HEADERS)
              try:
                  urllib.request.build_opener(NoRedirect).open(request, timeout=20)
                  raise RuntimeError('Expected an explicit artifact redirect')
              except urllib.error.HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      raise
                  location = response.headers['Location']
              assert urllib.parse.urlparse(location).scheme == 'https'
              # Deliberately create a fresh request without Authorization for the storage host.
              with urllib.request.urlopen(urllib.request.Request(location), timeout=20) as response:
                  raw = response.read(ZIP_BYTES + 1)
              assert len(raw) == ZIP_BYTES and hashlib.sha256(raw).hexdigest() == ZIP_SHA
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  info = archive.infolist()
                  assert len(info) == 11 and {row.filename for row in info} == EXPECTED
                  assert len({row.filename for row in info}) == len(info)
                  assert sum(row.file_size for row in info) <= 2_000_000
                  for row in info:
                      kind = stat.S_IFMT(row.external_attr >> 16)
                      assert not row.is_dir() and kind in (0, stat.S_IFREG) and row.file_size <= 512_000
                  data = {row.filename: archive.read(row) for row in info}
              index = json.loads(data['sha256-index.json'])
              assert set(index['files']) == EXPECTED - {'sha256-index.json'}
              for name, entry in index['files'].items():
                  assert len(data[name]) == entry['bytes']
                  assert hashlib.sha256(data[name]).hexdigest() == entry['sha256']
              # Validate UTF-8 text; no archive content is imported, evaluated or executed.
              for value in data.values():
                  value.decode('utf-8')
              provenance = {'repository': REPO, 'run_id': RUN, 'run_attempt': 1,
                            'head_sha': HEAD, 'artifact_id': ARTIFACT, 'zip_sha256': ZIP_SHA,
                            'zip_bytes': ZIP_BYTES, 'indexed_files_verified': 10,
                            'archive_members': 11, 'reader_head': os.environ['CURRENT_HEAD'],
                            'runtime_executed': False, 'database_started': False}
              print('PLAN_TIME_EVIDENCE_BEGIN ' + json.dumps(provenance, sort_keys=True))
              data['BoS_PLAN_TIME_35513613026.zip'] = raw
              manifest = []
              for name in sorted(data):
                  value = data[name]
                  encoded = base64.b64encode(value).decode('ascii')
                  parts = [encoded[i:i+6000] for i in range(0, len(encoded), 6000)] or ['']
                  entry = {'name': name, 'bytes': len(value),
                           'sha256': hashlib.sha256(value).hexdigest(), 'parts': len(parts)}
                  manifest.append(entry)
                  print('PLAN_TIME_MEMBER ' + json.dumps(entry, sort_keys=True))
                  for number, part in enumerate(parts):
                      print('PLAN_TIME_PART ' + json.dumps({'name': name, 'part': number, 'data': part}, sort_keys=True))
              print('PLAN_TIME_EVIDENCE_END ' + json.dumps({'provenance': provenance, 'manifest': manifest}, sort_keys=True))
          
          try:
              main()
          except Exception as exc:
              print('PLAN_TIME_EVIDENCE_FAILURE ' + type(exc).__name__)
              raise SystemExit(1)
          PY
