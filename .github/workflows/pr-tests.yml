# Адресні тести змінених модулів на кожен PR (рішення власника 01.10.2026).
# Лише синтетична SQLite-база; не full suite, не PostgreSQL, не E2E/browser.
name: BoS — тести PR
'on':
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: bos-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  training-crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BOS_DATA_MODE: demo
      BOS_VERIFY_DB: sqlite
      DJANGO_SETTINGS_MODULE: verification_settings
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Чи змінено training/ або crm/
      id: scope
      run: |
        if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(training|crm|connectors)/|^erp/(bos4_demo|bos4_demo_data|bos4_demo_aw_v11|test_bos4_demo|test_bos4_demo_v11|experience|test_next_step_names|monitoring|monitoring_views|test_monitoring|test_monitoring_bento|test_document_links|models|service|management/commands/seed_bos4_demo)\.py$|^scripts/(bos4_aw_subset|start_server|owner_local_delivery|test_owner_local_delivery|bos3_local)\.py$|^operations/(documents|views|urls|middleware|test_document_images|test_demo_access_header)\.py$'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"; echo "training/, crm/ і connectors/ не змінено — тести не потрібні."
        fi
    - if: steps.scope.outputs.run == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - if: steps.scope.outputs.run == 'true'
      run: python -m pip install -r requirements-ci.txt
    - if: steps.scope.outputs.run == 'true'
      name: запіновані CSV AdventureWorks для перевірки генератора (лише якщо змінено демо v1.1)
      run: |
        if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^erp/(bos4_demo_aw_v11|test_bos4_demo_v11)\.py$|^scripts/bos4_aw_subset\.py$'; then
          read -r COMMIT DIR <<< "$(python -c "from erp.bos4_demo_aw_v11 import PINS; print(PINS['commit'], PINS['path'])")"
          mkdir -p "$RUNNER_TEMP/aw/$DIR"
          for name in $(python -c "from erp.bos4_demo_aw_v11 import PINS; print(*sorted(PINS['csv_sha256']))"); do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/aw/$DIR/$name" \
              "https://raw.githubusercontent.com/microsoft/sql-server-samples/$COMMIT/$DIR/$name"
          done
          echo "BOS_AW_SOURCE=$RUNNER_TEMP/aw" >> "$GITHUB_ENV"
        fi
    - if: steps.scope.outputs.run == 'true'
      name: адресні тести змінених модулів (SQLite, bos3-fasteners)
      run: |
        mkdir -p "$RUNNER_TEMP/qa/media"
        BOS_TEST_DB_NAME="$RUNNER_TEMP/qa/bos3-fasteners-qa.sqlite3" BOS_TEST_MEDIA="$RUNNER_TEMP/qa/media" \
          python -B manage.py test training.test_sessions crm.test_contract connectors erp.test_bos4_demo erp.test_bos4_demo_v11 erp.test_next_step_names erp.test_monitoring erp.test_monitoring_bento erp.test_document_links operations.test_document_images operations.test_demo_access_header scripts.test_owner_local_delivery --noinput
  package-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Чи змінено склад пакета
      id: scope
      run: |
        if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(scripts/(package_server|test_package_server|bos3_local|test_bos3_local_launch_policy|test_bos4_local_profile)\.py|demo_settings\.py|bos3_local_settings\.py|boss_project/version\.py|\.github/workflows/pr-tests\.yml)$'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.scope.outputs.run == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - if: steps.scope.outputs.run == 'true'
      name: Склад пакета без запуску застосунку
      run: |
        python -B -m scripts.test_package_server
        python -B -m unittest scripts.test_bos3_local_launch_policy
        python -B scripts/test_bos4_local_profile.py
        python -B scripts/package_server.py --output "$RUNNER_TEMP/bos-dev-package"
  prepared-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Чи змінено процедуру оновлення prepared.json
      id: scope
      run: |
        if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(scripts/(bos3_prepared_update|test_bos3_prepared_update|bos3_local)\.py|\.github/workflows/pr-tests\.yml)$'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.scope.outputs.run == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - if: steps.scope.outputs.run == 'true'
      name: Синтетична перевірка контексту та ACL без запуску застосунку
      run: python -B -m unittest scripts.test_bos3_prepared_update
