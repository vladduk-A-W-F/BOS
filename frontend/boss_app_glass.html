/* ============ НАЛАШТУВАННЯ ============ */
function Settings({settings,setSettings,employees,industry,setIndustry}){
  const [tab,setTab]=useState('profile');
  const [newD,setNewD]=useState('');
  const upd=(path,val)=>{
    setSettings(prev=>{
      const s=JSON.parse(JSON.stringify(prev));
      const parts=path.split('.');
      let cur=s;
      for(let i=0;i<parts.length-1;i++)cur=cur[parts[i]];
      cur[parts[parts.length-1]]=val;
      return s;
    });
  };
  const COLORS=['#2E7CF6','#EF4444','#F7971E','#10B981','#0EA5E9','#E879F9','#F43F5E','#6366F1'];
  const STABS=[
    {id:'profile',l:'Профіль',ic:'user'},
    {id:'theme',l:'Вигляд',ic:'palette'},
    {id:'employees',l:'Співробітники',ic:'employees'},
    {id:'departments',l:'Відділи',ic:'building'},
    {id:'industry',l:'Діяльність',ic:'briefcase'},
    {id:'notifications',l:'Сповіщення',ic:'bell'},
    {id:'regional',l:'Регіональні',ic:'globe'},
    {id:'data',l:'Дані',ic:'db'},
  ];
  return(
    <div className="page" style={{padding:22}}>
      <PageHead title="Налаштування"/>
      <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
        <div style={{width:172,flexShrink:0,display:'flex',flexDirection:'column',gap:4}}>
          {STABS.map(t=>(
            <div key={t.id} className={'nav-it'+(tab===t.id?' on':'')} style={{margin:0,fontSize:12.5}}
                 onClick={()=>setTab(t.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&setTab(t.id)}>
              <span className="nav-ic">{ICONS[t.ic](15)}</span>{t.l}
            </div>
          ))}
        </div>
        <div style={{flex:1,minWidth:0}} key={tab}>
          {tab==='profile'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 18px'}}>Профіль керівника</h3>
              <div style={{display:'flex',gap:22,alignItems:'flex-start',flexWrap:'wrap'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,flexShrink:0}}>
                  <div style={{width:72,height:72,borderRadius:'50%',background:settings.profile.avatarColor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:700,color:'#fff',boxShadow:'inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px rgba(2,7,22,.4)'}}>{settings.profile.initials}</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,maxWidth:120,justifyContent:'center'}}>
                    {COLORS.map(c=>(
                      <div key={c} onClick={()=>upd('profile.avatarColor',c)}
                           style={{width:21,height:21,borderRadius:'50%',background:c,cursor:'pointer',transition:'transform .18s var(--ease-spring)',
                                   border:settings.profile.avatarColor===c?'2px solid #fff':'2px solid transparent',transform:settings.profile.avatarColor===c?'scale(1.15)':'scale(1)'}}/>
                    ))}
                  </div>
                </div>
                <div style={{flex:1,minWidth:240,display:'flex',flexDirection:'column',gap:12}}>
                  <div><label className="lbl">Ім'я</label><input className="input" value={settings.profile.name} onChange={e=>upd('profile.name',e.target.value)}/></div>
                  <div><label className="lbl">Посада</label><input className="input" value={settings.profile.position} onChange={e=>upd('profile.position',e.target.value)}/></div>
                  <div><label className="lbl">Ініціали</label><input className="input" style={{width:90}} maxLength={3} value={settings.profile.initials} onChange={e=>upd('profile.initials',e.target.value.slice(0,3).toUpperCase())}/></div>
                </div>
              </div>
            </div>
          )}
          {tab==='theme'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 6px'}}>Аврора-підсвітка</h3>
              <p style={{color:'var(--text-3)',fontSize:12,margin:'0 0 16px'}}>Колір свічення фону під стеклом</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:11}}>
                {Object.entries(MOODS).map(([k,t])=>(
                  <div key={k} onClick={()=>upd('theme',k)} className="lift"
                       style={{borderRadius:'var(--r-md)',overflow:'hidden',cursor:'pointer',
                               border:settings.theme===k?'2px solid var(--acc)':'1px solid var(--stroke)',
                               opacity:settings.theme===k?1:.75}}>
                    <div style={{height:54,background:MOOD_PREVIEW[k]}}/>
                    <div style={{background:'rgba(255,255,255,.05)',padding:'8px 11px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:11.5,fontWeight:settings.theme===k?700:400}}>{t.name}</span>
                      {settings.theme===k&&<span style={{color:'var(--acc)',display:'flex'}}>{ICONS.check(13)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {tab==='employees'&&(
            <div className="glass page" style={{padding:22}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 8px'}}>Перегляд ({employees.length})</h3>
              <p style={{color:'var(--text-3)',fontSize:12,margin:'0 0 12px'}}>Повне редагування — HR → Співробітники</p>
              {employees.map(e=>(
                <div key={e.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:'1px solid var(--stroke-soft)'}}>
                  <div className="avatar" style={{width:30,height:30,fontSize:10}}>{genAvatar(e.name)}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12.5}}>{e.name}</div>
                    <div style={{color:'var(--text-3)',fontSize:10.5}}>{e.dept}</div>
                  </div>
                  <Pill c={kpiColor(e.kpi||0)}>{e.kpi}%</Pill>
                </div>
              ))}
              {employees.length===0&&<p style={{color:'var(--text-3)',fontSize:12}}>Немає співробітників</p>}
            </div>
          )}
          {tab==='departments'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 14px'}}>Відділи підприємства</h3>
              <div style={{display:'flex',gap:9,marginBottom:16}}>
                <input className="input" style={{flex:1}} placeholder="Новий відділ" value={newD}
                       onChange={e=>setNewD(e.target.value)}
                       onKeyDown={e=>{if(e.key==='Enter'&&newD.trim()){upd('departments',[...settings.departments,newD.trim()]);setNewD('');}}}/>
                <button className="btn btn-primary" style={{fontSize:12.5}} onClick={()=>{if(!newD.trim())return;upd('departments',[...settings.departments,newD.trim()]);setNewD('');}}>{ICONS.plus(13)}Додати</button>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {settings.departments.map(d=>(
                  <div key={d} style={{display:'flex',alignItems:'center',gap:8,background:'var(--acc-glow)',border:'1px solid rgba(92,168,255,.4)',borderRadius:999,padding:'6px 14px'}}>
                    <span style={{fontSize:12.5}}>{d}</span>
                    <span onClick={()=>upd('departments',settings.departments.filter(x=>x!==d))}
                          role="button" aria-label={'Видалити відділ '+d}
                          style={{color:'var(--neg)',cursor:'pointer',display:'flex'}}>{ICONS.x(12)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {tab==='industry'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 14px'}}>Сфера діяльності</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:11}}>
                {INDUSTRIES.map(ind=>(
                  <div key={ind.id} className="glass lift press" onClick={()=>{localStorage.setItem('industry',JSON.stringify(ind));setIndustry(ind);}}
                       style={{padding:'16px 12px',textAlign:'center',cursor:'pointer',
                               border:industry?.id===ind.id?'1px solid rgba(92,168,255,.7)':'1px solid var(--stroke)',
                               boxShadow:industry?.id===ind.id?'0 0 0 3px rgba(92,168,255,.16)':undefined}}>
                    <div style={{fontSize:23,marginBottom:6}}>{ind.icon}</div>
                    <div style={{fontWeight:600,fontSize:12}}>{ind.label}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {tab==='notifications'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 14px'}}>Сповіщення</h3>
              {[{k:'tasks',l:'Доручення',d:'За день до дедлайну'},{k:'birthdays',l:'Дні народження',d:'За 3 дні'},{k:'reports',l:'Звітність',d:'За тиждень'},{k:'overdue',l:'Прострочені',d:'Щоденно'}].map(it=>(
                <div key={it.k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 0',borderBottom:'1px solid var(--stroke-soft)'}}>
                  <div>
                    <div style={{fontSize:13}}>{it.l}</div>
                    <div style={{color:'var(--text-3)',fontSize:11}}>{it.d}</div>
                  </div>
                  <div className={'switch'+(settings.notifications[it.k]?' on':'')} role="switch" aria-checked={settings.notifications[it.k]} tabIndex={0}
                       onClick={()=>upd('notifications.'+it.k,!settings.notifications[it.k])}
                       onKeyDown={e=>e.key==='Enter'&&upd('notifications.'+it.k,!settings.notifications[it.k])}>
                    <i/>
                  </div>
                </div>
              ))}
            </div>
          )}
          {tab==='regional'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 18px'}}>Регіональні налаштування</h3>
              <div style={{display:'flex',flexDirection:'column',gap:14,maxWidth:380}}>
                <div>
                  <label className="lbl">Валюта</label>
                  <select className="input" value={settings.currency} onChange={e=>upd('currency',e.target.value)}>
                    <option value="UAH">₴ Гривня</option><option value="USD">$ Долар</option><option value="EUR">€ Євро</option>
                  </select>
                </div>
                <div>
                  <label className="lbl">Мова</label>
                  <select className="input" value={settings.language} onChange={e=>upd('language',e.target.value)}>
                    <option value="uk">Українська</option><option value="ru">Русский</option><option value="en">English</option>
                  </select>
                </div>
                <div>
                  <label className="lbl">Формат дати</label>
                  <select className="input" value={settings.dateFormat} onChange={e=>upd('dateFormat',e.target.value)}>
                    <option value="uk">ДД.ММ.РРРР</option><option value="iso">РРРР-ММ-ДД</option><option value="us">ММ/ДД/РРРР</option>
                  </select>
                </div>
              </div>
            </div>
          )}
          {tab==='data'&&(
            <div className="glass page" style={{padding:24}}>
              <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 6px'}}>Джерела даних</h3>
              <p style={{color:'var(--text-3)',fontSize:12,margin:'0 0 16px'}}>Оберіть звідки завантажуються дані</p>
              {[{k:'finance',l:'Фінансові дані'},{k:'tasks',l:'Доручення'},{k:'calendar',l:'Розклад'},{k:'contractors',l:'Контрагенти'}].map(m=>(
                <div key={m.k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid var(--stroke-soft)',gap:12}}>
                  <span style={{fontSize:13}}>{m.l}</span>
                  <select className="input" style={{width:190}} value={settings.dataSources[m.k]} onChange={e=>upd('dataSources.'+m.k,e.target.value)}>
                    <option value="manual">Ручне введення</option>
                    <option value="csv">Імпорт CSV / Excel</option>
                    <option value="api">API інтеграція</option>
                    <option value="bank">Банківська виписка</option>
                  </select>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App(){
  const savedIndustry=(()=>{
    try{const raw=localStorage.getItem('industry');return raw?JSON.parse(raw):null;}
    catch{return null;}
  })();

  const [screen,setScreen]=useState(savedIndustry?'app':'onboarding');
  const [industry,setIndustry]=useState(savedIndustry);
  const [nav,setNav]=useState({section:'dash',sub:null});
  const [aiPanelOpen,setAiPanelOpen]=useState(()=>typeof window!=='undefined'&&window.innerWidth>=1400);
  const [tasks,setTasks]=useState([]);
  const [tasksLoading,setTasksLoading]=useState(true);
  const [tasksError,setTasksError]=useState(null);
  const [notes,setNotes]=useState(INIT_NOTES);
  const [employees,setEmployees]=useState([]);
  const [employeesLoading,setEmployeesLoading]=useState(true);
  const [employeesError,setEmployeesError]=useState(null);
  const [settings,setSettings]=useState(INIT_SETTINGS);
  const [counterparties,setCounterparties]=useState([]);
  const [contracts,setContracts]=useState([]);
  const [transactions,setTransactions]=useState([]);
  const [salaries,setSalaries]=useState([]);

  // Сотрудники: бекенд full_name/department → фронт name/dept (контракт не меняем)
  const refetchEmployees=()=>{
    setEmployeesLoading(true);setEmployeesError(null);
    api.get('/employees/')
      .then(data=>{
        setEmployees(data.map(e=>({id:e.id,name:e.full_name,role:e.role,dept:e.department,birthday:e.birthday,kpi:e.kpi,phone:e.phone,email:e.email,avatar:genAvatar(e.full_name)})));
        setEmployeesLoading(false);
      })
      .catch(err=>{
        console.error('Співробітники:',err);
        setEmployeesError(err.message||'Помилка зʼєднання');
        setEmployeesLoading(false);
      });
  };
  const refetchTasks=()=>{
    setTasksLoading(true);setTasksError(null);
    api.get('/tasks/')
      .then(data=>{setTasks(data);setTasksLoading(false);})
      .catch(err=>{
        console.error('Задачі:',err);
        setTasksError(err.message||'Помилка зʼєднання');
        setTasksLoading(false);
      });
  };
  const refetchCounterparties=()=>api.get('/counterparties/').then(setCounterparties).catch(console.error);
  const refetchContracts=()=>api.get('/contracts/').then(setContracts).catch(console.error);
  const refetchTransactions=()=>api.get('/transactions/').then(setTransactions).catch(console.error);
  const refetchSalaries=()=>api.get('/salaries/').then(setSalaries).catch(console.error);
  const refetchFinance=()=>{refetchCounterparties();refetchContracts();refetchTransactions();refetchSalaries();};

  useEffect(()=>{refetchEmployees();refetchTasks();refetchFinance();},[]);

  // Параллакс ауроры + Fluent reveal на карточках. Одно делегированное событие,
  // пишем только CSS-переменные/transform — без ре-рендеров (правило MotionValues).
  useEffect(()=>{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const mm=e=>{
      const el=e.target.closest&&e.target.closest('.lift');
      if(el){
        const r=el.getBoundingClientRect();
        el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
        el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
      }
      const lay=document.querySelector('.blob-layer');
      if(lay){
        const dx=(e.clientX/window.innerWidth-.5)*30,dy=(e.clientY/window.innerHeight-.5)*20;
        lay.style.transform=`translate(${dx}px,${dy}px)`;
      }
    };
    window.addEventListener('pointermove',mm,{passive:true});
    return()=>window.removeEventListener('pointermove',mm);
  },[]);

  const bg=(
    <div className="bg-stage">
      <div className="blob-layer">
        <div className="blob b1"/><div className="blob b2"/><div className="blob b3"/>
      </div>
      <div className="grain"/>
    </div>
  );

  if(screen==='onboarding')return(
    <div data-mood={settings.theme}>
      {bg}
      <Onboarding onComplete={ind=>{
        localStorage.setItem('industry',JSON.stringify(ind));
        setIndustry(ind);
        setScreen('app');
      }}/>
    </div>
  );

  const {section,sub}=nav;
  const renderContent=()=>{
    if(section==='dash')return <Dashboard tasks={tasks} employees={employees} settings={settings} setNav={setNav} transactions={transactions}/>;
    if(section==='finance'){
      if(sub==='bank'||!sub)return <Bank settings={settings} transactions={transactions} counterparties={counterparties} refetch={refetchTransactions}/>;
      if(sub==='contractors')return <Contractors counterparties={counterparties} refetch={refetchCounterparties}/>;
      if(sub==='contracts')return <Contracts contracts={contracts} counterparties={counterparties} refetch={refetchContracts}/>;
      if(sub==='salaries')return <Salaries salaries={salaries} employees={employees} refetch={refetchSalaries} refetchTransactions={refetchTransactions}/>;
    }
    if(section==='hr'){
      if(sub==='tasks'||!sub)return <Tasks tasks={tasks} setTasks={setTasks} loading={tasksLoading} error={tasksError} refetchTasks={refetchTasks}/>;
      if(sub==='employees')return <Employees employees={employees} depts={settings.departments} loading={employeesLoading} error={employeesError} refetchEmployees={refetchEmployees}/>;
      if(sub==='birthdays')return <Birthdays employees={employees}/>;
      if(sub==='kpi')return <KPI employees={employees}/>;
    }
    if(section==='organizer'){
      if(sub==='schedule'||!sub)return <Schedule/>;
      if(sub==='notes')return <Notes notes={notes} setNotes={setNotes}/>;
      if(sub==='reports')return <Reports/>;
    }
    if(section==='ai'){
      if(sub==='aichat'||!sub)return <AIChat refetchTasks={refetchTasks} refetchEmployees={refetchEmployees} refetchFinance={refetchFinance}/>;
      if(sub==='audiomeeting')return <AudioMeeting/>;
      if(sub==='dictaphone')return <Dictaphone/>;
    }
    if(section==='settings')return <Settings settings={settings} setSettings={setSettings} employees={employees} industry={industry} setIndustry={setIndustry}/>;
    return null;
  };

  // Бейдж HR — живой счётчик: активные + просроченные задачи
  const hrBadge=tasks.filter(t=>t.status==='active'||t.status==='overdue').length;

  return(
    <div data-mood={settings.theme} style={{height:'100vh',overflow:'hidden'}}>
      {bg}
      {/* Плавающие стеклянные острова над авророй */}
      <div style={{position:'relative',zIndex:1,display:'flex',height:'100vh',padding:14,gap:14}}>
        <Sidebar nav={nav} setNav={setNav} settings={settings} hrBadge={hrBadge}/>
        <div className="glass glass-panel" style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <Topbar nav={nav} setNav={setNav} settings={settings} aiPanelOpen={aiPanelOpen} setAiPanelOpen={setAiPanelOpen}/>
          <div style={{flex:1,overflowY:'auto',overflowX:'hidden'}} key={section+':'+(sub||'')}>
            {renderContent()}
          </div>
        </div>
        <AIPanel open={aiPanelOpen} onClose={()=>setAiPanelOpen(false)}
                 refetchTasks={refetchTasks} refetchEmployees={refetchEmployees} refetchFinance={refetchFinance}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><UIProvider><App/></UIProvider></ErrorBoundary>
);
{% endverbatim %}
</script>
</body>
</html>
