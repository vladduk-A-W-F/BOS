<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#F4F6F3;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(25,51,45,0.15);border-radius:4px}
input::placeholder,textarea::placeholder{color:rgba(25,51,45,0.25)}
select option{background:#FFFFFF}
/* Windows-like hover: лёгкое увеличение интерактивных элементов + плавность.
   Inline border-radius в JSX сильнее этого базового — правило страхует только кнопки без радиуса. */
button,select{border-radius:10px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
button:hover:not(:disabled),select:hover{transform:scale(1.05)}
button:active:not(:disabled){transform:scale(0.96)}
/* Примитивы Button/SegmentedControl: hover = зміна фону/яскравості, БЕЗ глобального scale (§7 — один ефект).
   Специфічність .класс:hover:not() вища за button:hover:not() — transform:none перемагає без !important */
.ui-btn:hover:not(:disabled){transform:none;background:rgba(25,51,45,0.07);filter:brightness(1.1)}
.seg-item{background:transparent;text-align:left}
.seg-item:hover:not(:disabled){transform:none;background:rgba(25,51,45,0.06)}
/* Плитки дашборда: hover = scale + осветление + контурная линия (конституция §7a).
   filter вместо background — фон KPI-плитки задаёт TONE_BG[tone] (зелёный/жовтий/
   червоний за планом), подмена фона стёрла бы индикацию статуса.
   box-shadow вместо border-color — border прописан инлайн в JSX, инлайн сильнее класса.
   z-index — иначе увеличенная плитка уходит под соседние. */
.dash-tile{position:relative;
  transition:transform .3s ease, filter .3s ease, box-shadow .3s ease}
.dash-tile:hover{transform:scale(1.03); filter:brightness(1.14);
  box-shadow:0 0 0 1px rgba(25,51,45,0.16); z-index:5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(102,126,234,0.4)}50%{box-shadow:0 0 0 5px rgba(102,126,234,0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* Вертолёт: пульс красного светофора — «здесь пожар» должен считываться периферией */
@keyframes heliPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.45)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
/* ── Aurora-слой: субтильні золото/індиго радіали за контентом, повільний дрейф (§3) ──
   inset:-20% — щоб дрейф не оголював краї; z-index:-1 — за контентом; GPU: transform/opacity */
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 85% -10%, rgba(245,180,0,0.04) 0%, transparent 45%),
    radial-gradient(ellipse at -10% 110%, rgba(99,102,241,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 110% 95%, rgba(245,180,0,0.02) 0%, transparent 40%);
  animation:auroraDrift 50s ease-in-out infinite alternate;
  will-change:transform,opacity}
@keyframes auroraDrift{
  from{transform:translate(0,0) scale(1);opacity:.8}
  to{transform:translate(2%,3%) scale(1.06);opacity:1}}
/* ── Верхняя навигация: icon-пилюли с hover-раскрытием ──
   Раскрывается сам СЛОТ (пилюля width:100% следует за ним) — соседи плавно
   расступаются, никто никого не перекрывает (выбор Ника, ТЗ №2). */
.nav-slot{position:relative;width:44px;height:44px;flex-shrink:0;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.nav-slot:hover{width:132px;z-index:60}
.nav-pill{position:relative;width:100%;height:44px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;appearance:none;cursor:pointer;overflow:hidden;
  background:rgba(25,51,45,0.04);border:1px solid rgba(25,51,45,0.09);color:rgba(25,51,45,0.6);
  transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease}
/* Раскрытая пилюля — стекло с mint-акцентом (граница), не сплошная зелёная заливка */
.nav-slot:hover .nav-pill{background:rgba(25,51,45,0.10);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-color:rgba(25,51,45,0.14);color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,0.4)}
/* Активний розділ — нейтральна поверхня; єдиний акцент — тонка золота смужка знизу */
.nav-pill.active{background:rgba(25,51,45,0.08);border-color:rgba(25,51,45,0.12);color:#19332D}
.nav-pill.active::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:16px;height:2px;border-radius:2px;background:#f5b400}
.nav-pill-icon{display:flex;align-items:center;justify-content:center;transition:transform .22s ease,opacity .18s ease}
.nav-slot:hover .nav-pill-icon{transform:scale(0);opacity:0}
.nav-pill-label{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:13px;font-weight:700;color:#19332D;
  opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.nav-slot:hover .nav-pill-label{opacity:1;transform:scale(1);transition-delay:.12s}
/* Индикаторы на углу слота (badge HR, online-точка AI) — прячутся на hover, чтобы не мешать подписи */
.nav-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:rgba(25,51,45,0.12);color:#19332D;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:2;border:2px solid #F4F6F3;transition:opacity .2s}
/* Online-точка AI — индиго (фирменный цвет AI) */
.nav-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#6366f1;
  border:2px solid #F4F6F3;pointer-events:none;z-index:2;transition:opacity .2s}
.nav-slot:hover .nav-badge,.nav-slot:hover .nav-dot{opacity:0}
/* Dropdown под-пунктов открывается только явным действием на trigger. */
.nav-dropdown{position:absolute;top:calc(100% + 10px);left:50%;min-width:210px;padding:6px;border-radius:14px;
  background:rgba(21,23,27,0.92);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(25,51,45,0.1);box-shadow:0 16px 44px rgba(0,0,0,0.55);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-6px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s;z-index:70}
.nav-dropdown.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.nav-dropdown[hidden]{display:none}
.nav-drop-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;box-sizing:border-box;border:0;border-radius:9px;cursor:pointer;text-align:left;background:transparent;
  color:rgba(25,51,45,0.65);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.nav-drop-item:hover{background:rgba(25,51,45,0.07);color:#fff}
/* Активний під-пункт: нейтральна поверхня, золото лише текстом (інакше не відрізнити від hover) */
.nav-drop-item.active{background:rgba(25,51,45,0.08);color:#f5b400;font-weight:600}
/* ── Hover карточки: ОДИН стриманий ефект — легкий підйом + м'яка тінь (конституція §7) ──
   !important лишається ТІЛЬКИ на box-shadow: окремі картки задають тінь інлайн (boxShadow в override cardS) */
.living-card{transition:transform .2s ease, box-shadow .2s ease}
.living-card:hover{transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(0,0,0,0.45) !important}
/* Markdown styling for AI chat bubbles */
.ai-md p { margin: 0 0 8px; }
.ai-md p:last-child { margin-bottom: 0; }
.ai-md ul, .ai-md ol { margin: 6px 0 6px 18px; padding: 0; }
.ai-md li { margin: 3px 0; }
.ai-md strong { color: #19332D; font-weight: 600; }

function bosRole(){return ['ceo','manager','observer'].includes(window.BOS_RUNTIME?.role)?window.BOS_RUNTIME.role:'observer';}
function bosCan(key){
 const explicit=window.BOS_RUNTIME?.capabilities?.[key];
 if(typeof explicit==='boolean')return explicit;
 if(['finance','hr_private'].includes(key))return bosRole()==='ceo';
 if(key==='write')return ['ceo','manager'].includes(bosRole());
 return false;
}
function bosStorageKey(key){const r=window.BOS_RUNTIME||{};return ['bos',r.mode||'unknown',r.user_id??'anonymous',bosRole(),key].join(':');}
function bosCanAction(action){
 if(!bosCan('write'))return false;
 if(['opening','payment','apply_change','resolve_job','adjust','import_batch','credit_invoice','reverse_credit','confirm_supplier_claim','hold_payment','release_payment','location_update','order_network','purchase_network','register_supplier_invoice'].includes(action))return bosRole()==='ceo';
 if(['attach','change'].includes(action)&&!bosCan('view_documents'))return false;
 if(['quality','operator'].includes(action)&&bosRole()!=='ceo'&&!window.BOS_RUNTIME?.employee_id)return false;
 return true;
}
function bosCanView(section,sub){
 if(section==='erp'&&sub==='costs')return bosCan('finance');
 if(section==='finance'&&['costs','invoices'].includes(sub))return bosCan('finance')||bosRole()==='manager';
 if(section==='finance'&&sub==='salaries')return bosCan('finance');
 if(section==='finance'&&sub==='bank')return bosRole()!=='observer';
 if(section==='hr'&&['birthdays','kpi'].includes(sub))return bosCan('hr_private');
 if((section==='organizer'&&sub==='documents')||section==='documents')return bosCan('view_documents');
 if(section==='ai'&&['audiomeeting','dictaphone'].includes(sub))return bosCan('external_llm')&&bosCan('write');
 return true;
}
function bosNavigation(){return NAV.map(n=>({...n,subs:n.subs.filter(x=>bosCanView(n.id,x.id))})).filter(n=>bosCanView(n.id,null));}

function useLocalState(key,initial){
 const [value,setValue]=useState(()=>{try{const raw=localStorage.getItem(bosStorageKey(key));return raw?JSON.parse(raw):initial;}catch{return initial;}});
 useEffect(()=>{try{localStorage.setItem(bosStorageKey(key),JSON.stringify(value));}catch{window.dispatchEvent(new CustomEvent('boss:notice',{detail:'Не вдалося зберегти зміни в браузері. Перевірте доступне місце.'}));}},[key,value]);
 return [value,setValue];
}


// Error Boundary — catches any React render-time error and shows a friendly fallback
// instead of a blank white screen. Must be a class (React has no hook equivalent yet).
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  // Called when a child throws — switches state to render the fallback UI
  static getDerivedStateFromError(error){return {hasError:true,error};}
  // Side-effect: log to console so devs still see the stack trace
  componentDidCatch(error,info){console.error('BoS error:',error,info);}
  render(){
    if(this.state.hasError){
      return (
        <div style={{padding:40,color:T.text,background:'#F4F6F3',minHeight:'100vh',fontFamily:'Inter,system-ui,sans-serif'}}>
          <h2 style={{color:T.red,marginBottom:16}}>Щось пішло не так</h2>
          <p style={{color:'rgba(25,51,45,0.7)',marginBottom:20}}>
            BoS зіткнувся з помилкою. Спробуй оновити сторінку (Cmd+R).
          </p>
          <details style={{color:T.textMuted,fontSize:12,fontFamily:'monospace'}}>
            <summary style={{cursor:'pointer'}}>Технічні деталі</summary>
            <pre style={{marginTop:10,whiteSpace:'pre-wrap'}}>{String(this.state.error)}</pre>
          </details>
          <button onClick={()=>window.location.reload()} style={{marginTop:20,padding:'10px 20px',background:'#f5b400',color:'#0f172a',border:'none',borderRadius:12,cursor:'pointer'}}>
            Оновити сторінку
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const priorityMeta = (p) => {

// Настоящий glassmorphism — backdrop-blur + прозрачный фон + внутренний блик + мягкая тень.
// С Крока 2 зарезервирован ТОЛЬКО для NavBar и AIPanel (у них сейчас инлайн-эквивалент).
// Контент-карточки — Card / cardS() (сплошная surface2), НЕ стекло.
const glass = (e = {}) => ({
  background: 'rgba(25,51,45,0.05)',
  backdropFilter: 'blur(36px) saturate(180%)',
  WebkitBackdropFilter: 'blur(36px) saturate(180%)',
  border: '1px solid rgba(25,51,45,0.12)',
  borderRadius: T.radLg,
  boxShadow: '0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(25,51,45,0.12)',
  color: T.text,
  ...e,
});

// ════════ UI-примітиви (Крок 2, конституція §8) — джерело істини для вигляду ════════
// Всі сторінки збираються з цих цеглинок. Стилі — тільки з токенів T.

// Стиль контент-картки: СУЦІЛЬНА поверхня surface2 (заміна glass() на контенті;
// glass() лишається тільки для NavBar та AIPanel). Два способи вживання:
//   <Card pad={16}>…</Card>          — компонент (новий код, прості обгортки)
//   <div style={cardS({padding:16})}> — style-хелпер (точкова міграція старих блоків)
// Обидва беруть стиль ЗВІДСИ — одне джерело істини.
const cardS = (e = {}) => ({
  background: T.surface2,
  border: '1px solid ' + T.border,
  borderRadius: T.radLg,
  padding: 20,
  color: T.text,
  ...e,
});
function Card({children, hover, pad = 20, style = {}, ...rest}) {
  return (
    <div {...rest} className={hover ? 'bos-card living-card' : 'bos-card'}
         style={cardS({padding:pad, ...style})}>
      {children}
    </div>
  );
}

// Кнопка з варіантами: primary для головної дії, subtle для допоміжної.
// Hover — зміна фону/яскравості через CSS-клас .ui-btn (глобальний scale придушено).
function Button({variant = 'subtle', children, style = {}, ...rest}) {
  const variants = {
    primary: {background:T.primary, color:T.onPrimary, boxShadow:'0 2px 4px rgba(18,107,85,.12)'},
    ghost:   {color:T.text, border:'1px solid '+T.border},           // фон дає CSS (transparent)
    subtle:  {background:T.surface, color:T.text, border:'1px solid '+T.border},
    danger:  {background:T.red, color:T.onPrimary},
  };
  return (
    <button {...rest} className={"ui-btn ui-btn--"+variant}
            style={{padding:'10px 18px', border:'none', borderRadius:T.radMd, fontWeight:600,
                    fontSize:14, minHeight:42, cursor:'pointer', ...(variants[variant] || variants.subtle), ...style}}>
      {children}
    </button>
  );
}

// Бейдж-метка: фон = тон із низькою альфою, текст = колір тону
function Badge({tone = 'neutral', children, style = {}}) {
  const tones = {
    neutral: [T.surface, T.textMuted],
    success: [T.green + '22',  T.green],
    warning: [T.yellow + '22', T.yellow],
    danger:  [T.red + '22',    T.red],
    ai:      [T.blue + '22',   T.blue],
    accent:  [T.primaryGlow,   T.primary],
  };
  const [bg, c] = tones[tone] || tones.neutral;
  return <span style={{...pill(bg, c), ...style}}>{children}</span>;
}

// Крапка статусу — індикація без великих плашок
function StatusDot({color = T.textDim, size = 8, style = {}}) {
  return <span style={{display:'inline-block', width:size, height:size, borderRadius:'50%',
                       background:color, flexShrink:0, ...style}}/>;

// Пріоритет: маленька крапка + приглушений підпис (НЕ кольорова плашка)

  const {color, label} = priorityMeta(priority);
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:6, whiteSpace:'nowrap'}}>
      <StatusDot color={color} size={7}/>

// Сегментований перемикач — заміна всіх інлайн фільтр-рядків.
// options=[{key,label}]. Активний: surface3 + золотий текст; hover — через CSS .seg-item.
function SegmentedControl({options, value, onChange, size = 'md', style = {}}) {
  const pad = size === 'sm' ? '5px 10px' : '7px 14px';
  return (
    <div style={{display:'inline-flex', gap:2, padding:3, background:T.surface,
                 border:'1px solid '+T.border, borderRadius:T.radMd, flexWrap:'wrap', ...style}}>
      {options.map(o => {
        const active = o.key === value;
        return (
          <button key={o.key} onClick={() => onChange(o.key)} className="seg-item"
                  style={{padding:pad, fontSize:12, fontWeight: active ? 600 : 500, border:'none',
                          borderRadius:T.radSm, cursor:'pointer', whiteSpace:'nowrap',
                          color: active ? T.primary : T.textMuted,
                          transition:'background .15s ease, color .15s ease',
                          ...(active ? {background:T.surface3} : {})}}>
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

// Плитка-іконка: скруглений квадрат з іконкою, фон = тон із низькою альфою
function IconTile({icon, tone = 'accent', size = 40, style = {}}) {
  const tones = {
    accent:  [T.primaryGlow, T.primary],
    ai:      [T.blueGlow, T.blue],
    neutral: [T.surface, T.textMuted],
  };
  const [bg, c] = tones[tone] || tones.neutral;
  return (
    <div style={{width:size, height:size, borderRadius:T.radMd, background:bg, color:c,

//  Дашборд — намеренная стилевая зона-исключение: он цветной (exec-вид),

// ═══════════════════════════════════════════════════════════════════════════

// Пороги план/факт → цвет. Единственное место, где живёт это правило:
// его используют и карточки KPI, и точки на карте, и дерево.
const toneByPct = (pct) => (pct >= 100 ? 'good' : pct >= 90 ? 'warn' : 'bad');
const TONE_COLOR = {good: DASH.green, warn: DASH.yellow, bad: DASH.red};
const TONE_BG    = {good: DASH.goodBg, warn: DASH.warnBg, bad: DASH.badBg};

// Крупные суммы в карточках руководителя — компактно (152,0 млн ₴),
// иначе 9 цифр не помещаются и карточки перестают читаться с одного взгляда.
const CUR_SIGN = {USD: '$', EUR: '€', UAH: '₴'};
const fmtCompact = (n, cur = 'UAH') => {
  const sign = CUR_SIGN[cur] || '₴';
  const abs = Math.abs(n);
  // Один знак после запятой на всех крупных порядках — как в мокапе ($15.2M):
  // карточки одного ряда должны иметь одинаковую «плотность» цифр.
  const short = (v, suffix) => `${v.toFixed(1).replace('.', ',')} ${suffix}`;
  if (abs >= 1e9) return `${short(n / 1e9, 'млрд')} ${sign}`;
  if (abs >= 1e6) return `${short(n / 1e6, 'млн')} ${sign}`;
  if (abs >= 1e3) return `${Math.round(n / 1e3)} тис. ${sign}`;
  return `${Math.round(n)} ${sign}`;
};
const fmtCount = (n) => new Intl.NumberFormat('uk-UA').format(Math.round(n || 0));

// ── Sparkline ──────────────────────────────────────────────────────────────
// Мини-график динамики внутри карточки. Ряд приходит с бэка; последняя точка
// всегда равна показанному значению, поэтому график не спорит с цифрой.
function Sparkline({data, color, area = false, w = 100, h = 30}) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const span = (max - min) || 1;
  const pt = (v, i) => [
    (i / (data.length - 1)) * w,
    h - 3 - ((v - min) / span) * (h - 6),
  ];
  const pts = data.map(pt);
  const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  // Заливка под линией — тот же путь, замкнутый по нижней кромке.
  const fill = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"
         style={{display:'block', overflow:'visible'}}>
      {area && <path d={fill} fill={color} opacity={0.14}/>}
      <path d={line} fill="none" stroke={color} strokeWidth={1.6}
            strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
}

// ── A. Дерево структуры компании ───────────────────────────────────────────
// Рекурсивное и полностью generic: строит иерархию из плоского списка по
// parent_id, глубина любая. Подсунешь другую оргструктуру — отрисуется как есть.
function TreeNode({node, depth, expanded, toggle, selectedBranch, setSelectedBranch, fullNames}) {
  const hasKids = node.children.length > 0;
  const isOpen = expanded[node.code] !== false;   // по умолчанию раскрыто
  const isSelected = selectedBranch === node.id;

  return (
    <Fragment>
      <div role="button" tabIndex={0}
           onClick={() => setSelectedBranch(node.id)}
           onKeyDown={e => onKey(e, () => setSelectedBranch(node.id))}
           title={node.name}
           style={{display:'flex', alignItems:'center', gap:6, cursor:'pointer',
                   padding:'6px 8px', paddingLeft: depth * 13 + 8, borderRadius:8,
                   background: isSelected ? 'rgba(59,130,246,0.16)' : 'transparent',
                   borderLeft: `2px solid ${isSelected ? DASH.blue : 'transparent'}`,
                   marginBottom:1, transition:'background .15s'}}>
        {hasKids ? (
          <span role="button" tabIndex={0}
                onClick={(e) => {e.stopPropagation(); toggle(node.code);}}
                onKeyDown={e => onKey(e, () => toggle(node.code))}
                style={{color:DASH.textDim, fontSize:9, width:11, flexShrink:0}}>
            {isOpen ? '▼' : '▶'}
          </span>
        ) : <span style={{width:11, flexShrink:0}}/>}
        <span style={{width:7, height:7, borderRadius:'50%', flexShrink:0,
                      background: statusColor(node.status)}}/>
        <span style={{color: isSelected ? DASH.text : 'rgba(232,237,244,0.85)', fontSize:12,
                      fontWeight: isSelected ? 600 : 500, flex:1, minWidth:0,
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
          {fullNames ? node.name : (node.short_name || node.name)}
        </span>
        {/* У контейнера считаем дочерние узлы, у листа — сотрудников */}
        <span style={{color:DASH.textDim, fontSize:10, flexShrink:0}}>
          {hasKids ? node.children.length : (node.employee_count || '')}
        </span>
      </div>
      {hasKids && isOpen && node.children.map(kid => (
        <TreeNode key={kid.id} node={kid} depth={depth + 1} expanded={expanded} toggle={toggle}
                  selectedBranch={selectedBranch} setSelectedBranch={setSelectedBranch}
                  fullNames={fullNames}/>
      ))}
    </Fragment>
  );
}

// Порядок типов узлов в дереве — зеркалит TYPE_ORDER на бэке (branches/serializers.py).
const TREE_TYPE_ORDER = ['headquarters', 'department', 'regional', 'mobile', 'foreign'];

function CompanyTree({branches, selectedBranch, setSelectedBranch}) {
  const [expanded, setExpanded] = useState({});
  const [collapsed, setCollapsed] = useState(false);
  const [fullNames, setFullNames] = useState(false);
  const toggle = (code) => setExpanded(p => ({...p, [code]: p[code] === false}));

  // Плоский список → дерево.
  const roots = [];
  const byId = {};
  branches.forEach(b => { byId[b.id] = {...b, children: []}; });
  branches.forEach(b => {
    const node = byId[b.id];
    if (b.parent && byId[b.parent]) byId[b.parent].children.push(node);
    else roots.push(node);
  });
  // Тип задаёт порядок групп (центр выше периферии), имя — порядок внутри группы.
  // Сравнение имён именно здесь, а не на бэке: сортировка по украинскому
  // алфавиту требует ICU, который в браузере есть, а в Python из коробки нет
  // ('І' там встаёт перед 'А' по коду символа).
  const sortNodes = (arr) => {
    arr.sort((a, b) => (TREE_TYPE_ORDER.indexOf(a.type) - TREE_TYPE_ORDER.indexOf(b.type))
                       || a.name.localeCompare(b.name, 'uk'));
    arr.forEach(n => sortNodes(n.children));
  };
  sortNodes(roots);

  return (
    <div style={{background:DASH.card, border:`1px solid ${DASH.border}`, borderRadius:DASH.rad,
                 padding:12, width: fullNames ? 360 : 246, transition:'width .25s ease',
                 flexShrink:0, display:'flex', flexDirection:'column',
                 gap:4, alignSelf:'flex-start'}}>
      <div role="button" tabIndex={0} aria-expanded={!collapsed}
           onClick={() => setCollapsed(c => !c)}
           onKeyDown={e => onKey(e, () => setCollapsed(c => !c))}
           style={{display:'flex', alignItems:'center', gap:6, cursor:'pointer',
                   padding:'4px 8px 8px'}}>
        <span style={{color:DASH.textDim, fontSize:10, fontWeight:800, letterSpacing:'0.08em',
                      flex:1}}>СТРУКТУРА КОМПАНІЇ</span>
        <span role="button" tabIndex={0}
              onClick={(e) => {e.stopPropagation(); setFullNames(v => !v);}}
              onKeyDown={e => onKey(e, () => setFullNames(v => !v))}
              title={fullNames ? 'Показати короткі назви' : 'Показати повні назви'}
              style={{color:DASH.textDim, fontSize:10, cursor:'pointer', padding:'2px 6px',
                      border:`1px solid ${DASH.border}`, borderRadius:6, flexShrink:0}}>
          {fullNames ? 'Коротко' : 'Повністю'}
        </span>
        <span style={{color:DASH.textDim, fontSize:10}}>{collapsed ? '▶' : '▼'}</span>
      </div>

      {!collapsed && (
        <div style={{maxHeight:'46vh', overflowY:'auto', paddingRight:2}}>
          {/* Корень — сводка по всей компании (selectedBranch = null) */}
          <div role="button" tabIndex={0} onClick={() => setSelectedBranch(null)}
               onKeyDown={e => onKey(e, () => setSelectedBranch(null))}
               style={{display:'flex', alignItems:'center', gap:7, cursor:'pointer',
                       padding:'8px', borderRadius:8, marginBottom:4,
                       background: selectedBranch === null ? 'rgba(59,130,246,0.16)' : 'transparent',
                       borderLeft:`2px solid ${selectedBranch === null ? DASH.blue : 'transparent'}`}}>
            <span style={{fontSize:12}}>📄</span>
            <span style={{color:DASH.text, fontSize:11, fontWeight:700, letterSpacing:'0.02em',
                          lineHeight:1.3}}>
              ЗАГАЛЬНИЙ ЗВІТ ПО ПІДПРИЄМСТВУ
            </span>
          </div>

          {roots.map(node => (
            <TreeNode key={node.id} node={node} depth={0} expanded={expanded} toggle={toggle}
                      selectedBranch={selectedBranch} setSelectedBranch={setSelectedBranch}
                      fullNames={fullNames}/>
          ))}
          {!branches.length && (
            <div style={{color:DASH.textDim, fontSize:11, padding:'8px'}}>
              Структура не завантажена
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── A5. Дни рождения — только руководители ─────────────────────────────────
// Не весь штат: на дашборде руководителя важны ближайшие ДР топов.
// Отбор по ключевым словам в должности — generic, не завязано на конкретные ФИО.
const EXEC_ROLE_HINTS = ['директор', 'керівник', 'заступник', 'начальник', 'голов', 'ceo', 'cfo'];
const isExecutive = (e) => {
  const role = (e.role || '').toLowerCase();
  return EXEC_ROLE_HINTS.some(h => role.includes(h));
};

function ExecBirthdays({employees}) {
  const execs = employees.filter(isExecutive);
  // Если ролей-руководителей в данных нет — берём топ по KPI, чтобы блок
  // не пустовал на любой структуре данных.
  const pool = execs.length ? execs : [...employees].sort((a, b) => (b.kpi || 0) - (a.kpi || 0));
  const list = pool
    .filter(e => e.birthday)
    .sort((a, b) => daysUntil(a.birthday) - daysUntil(b.birthday))
    .slice(0, 3);

  return (
    <div style={{background:DASH.card, border:`1px solid ${DASH.border}`, borderRadius:DASH.rad,
                 padding:12, width:246, flexShrink:0}}>
      <div style={{display:'flex', alignItems:'baseline', gap:6, padding:'2px 4px 10px'}}>
        <span style={{color:DASH.textDim, fontSize:10, fontWeight:800, letterSpacing:'0.08em'}}>
          ДНІ НАРОДЖЕННЯ
        </span>
        <span style={{color:DASH.textDim, fontSize:9, opacity:0.7}}>· керівництво</span>
      </div>
      {!list.length && (
        <div style={{color:DASH.textDim, fontSize:11, padding:'2px 4px'}}>Немає даних</div>
      )}
      {list.map(e => {
        const days = daysUntil(e.birthday);
        const soon = days <= 7;
        return (
          <div key={e.id} style={{display:'flex', alignItems:'center', gap:9, padding:'6px 4px'}}>
            <span style={{width:28, height:28, borderRadius:'50%', flexShrink:0,
                          background:'rgba(59,130,246,0.18)', color:DASH.blue, fontSize:10,
                          fontWeight:700, display:'flex', alignItems:'center',
                          justifyContent:'center'}}>
              {e.avatar || genAvatar(e.name)}
            </span>
            <div style={{flex:1, minWidth:0}}>
              <div style={{color:DASH.text, fontSize:11, fontWeight:600, overflow:'hidden',
                           textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{e.name}</div>
              <div style={{color:DASH.textDim, fontSize:10, overflow:'hidden',
                           textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{e.role}</div>
            </div>
            <span style={{color: soon ? DASH.yellow : DASH.textDim, fontSize:10, fontWeight:700,
                          flexShrink:0}}>
              {days === 0 ? 'сьогодні' : `${days} дн.`}
            </span>
          </div>
        );
      })}
    </div>
  );
}

// ── C3. KPI-карточки ───────────────────────────────────────────────────────
// Список декларативный: карточки рендерятся по конфигу, а не восемью
// копипастами. Добавить KPI = добавить строку сюда и ключ в ответ бэка.
const KPI_CARDS = [
  {key:'revenue',    label:'ДОХІД'},
  {key:'expenses',   label:'ВИТРАТИ'},
  {key:'ebitda',     label:'EBITDA'},
  {key:'net_profit', label:'ЧИСТИЙ ПРИБУТОК'},
  {key:'net_margin', label:'ЧИСТА МАРЖИНАЛЬНІСТЬ', format:'pct'},
  {key:'cash_flow',  label:'CASH FLOW'},
  // lowerIsBetter — рост расходов и задолженности это ухудшение, поэтому
  // стрелка тренда красится зеркально (бэк так же зеркалит % выполнения).
  {key:'receivable', label:'ДЕБІТОРСЬКА ЗАБОРГОВАНІСТЬ', lowerIsBetter:true},
  {key:'payable',    label:'КРЕДИТОРСЬКА ЗАБОРГОВАНІСТЬ', lowerIsBetter:true},
];
// «Витрати» тоже из этой категории — правим конфиг точечно, чтобы список выше
// читался как перечень карточек, а не как таблица флагов.
KPI_CARDS[1].lowerIsBetter = true;

function KPICard({label, data, format, cur, lowerIsBetter}) {
  if (!data) return null;
  const tone = toneByPct(data.pct);
  const color = TONE_COLOR[tone];
  const value = format === 'pct' ? `${data.actual}%` : fmtCompact(data.actual, cur);
  const rising = (data.trend || '').startsWith('+');
  const falling = (data.trend || '').startsWith('-');
  const trendUp = lowerIsBetter ? falling : rising;     // «хорошо» — зелёная
  const trendDown = lowerIsBetter ? rising : falling;   // «плохо» — красная

  return (
    <div className="dash-tile" style={{background:TONE_BG[tone] || DASH.card, borderRadius:DASH.rad, padding:'13px 14px',
                 border:`1px solid ${TONE_BORDER[tone] || DASH.border}`,
                 display:'flex', flexDirection:'column', gap:7, minWidth:0}}>
      <div style={{color:DASH.textDim, fontSize:9, fontWeight:700, letterSpacing:'0.07em',
                   overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
        {label}
      </div>
      <div style={{color:DASH.text, fontSize:22, fontWeight:700, lineHeight:1.1}}>{value}</div>

      <div style={{display:'flex', alignItems:'baseline', gap:6}}>
        <span style={{color, fontSize:11, fontWeight:800}}>{data.pct}%</span>
        <span style={{color:DASH.textDim, fontSize:10}}>плану</span>
        {data.trend && (
          // Стрелка — направление изменения, цвет — хорошо это или плохо.
          <span style={{marginLeft:'auto', fontSize:10, fontWeight:700,
                        color: trendUp ? DASH.green : trendDown ? DASH.red : DASH.textDim}}>
            {rising ? '▲' : falling ? '▼' : '—'} {data.trend}
          </span>
        )}
      </div>

      <Sparkline data={data.spark} color={color} area h={26}/>

      <div style={{color:DASH.textDim, fontSize:9}}>
        План: {format === 'pct' ? `${data.plan}%` : fmtCompact(data.plan, cur)}
      </div>
    </div>
  );
}

// ── C4.2 Задачи — пончик ───────────────────────────────────────────────────
function TaskDonut({taskStats}) {
  const segments = [
    {label:'Виконане',      count: taskStats.done    || 0, color: DASH.green},
    {label:'У роботі',      count: taskStats.active  || 0, color: DASH.blue},
    {label:'Опрацьовується', count: taskStats.process || 0, color: DASH.yellow},
    {label:'Прострочене',   count: taskStats.overdue || 0, color: DASH.red},
  ];
  const total = segments.reduce((s, x) => s + x.count, 0) || 1;
  const r = 38;
  const circumference = 2 * Math.PI * r;
  let offset = 0;

  return (
    <div className="dash-tile" style={{background:DASH.card, border:`1px solid ${DASH.border}`, borderRadius:DASH.rad,
                 padding:16, display:'flex', flexDirection:'column', gap:10, minWidth:0}}>
      <div style={{color:DASH.textDim, fontSize:10, fontWeight:800, letterSpacing:'0.07em'}}>
        ЗАДАЧІ
      </div>
      <div style={{display:'flex', alignItems:'center', gap:14}}>
        <svg width={96} height={96} viewBox="0 0 100 100" style={{flexShrink:0}}>
          <g transform="rotate(-90 50 50)">
            {segments.map((seg, i) => {
              const len = (seg.count / total) * circumference;
              const el = (
                <circle key={i} cx={50} cy={50} r={r} fill="none" stroke={seg.color}
                        strokeWidth={13} strokeDasharray={`${len} ${circumference - len}`}
                        strokeDashoffset={-offset}/>
              );
              offset += len;
              return el;
            })}
          </g>
          <text x={50} y={46} textAnchor="middle" fill={DASH.text} fontSize="18" fontWeight="700">
            {fmtCount(taskStats.total)}
          </text>
          <text x={50} y={60} textAnchor="middle" fill={DASH.textDim} fontSize="8">всього</text>
        </svg>
        <div style={{display:'flex', flexDirection:'column', gap:5, flex:1, minWidth:0}}>
          {segments.map((seg, i) => {
            const pct = Math.round((seg.count / total) * 100);
            // Просроченные акцентируем: это то, ради чего руководитель смотрит виджет.
            const isOverdue = seg.color === DASH.red && seg.count > 0;
            return (
              <div key={i} style={{display:'flex', alignItems:'center', gap:6}}>
                <span style={{width:7, height:7, borderRadius:'50%', background:seg.color,
                              flexShrink:0}}/>
                <span style={{color: isOverdue ? DASH.red : DASH.textDim, fontSize:10.5,
                              fontWeight: isOverdue ? 700 : 400, flex:1, minWidth:0,
                              overflow:'hidden', textOverflow:'ellipsis',
                              whiteSpace:'nowrap'}}>{seg.label}</span>
                <span style={{color: isOverdue ? DASH.red : DASH.text, fontSize:10.5,
                              fontWeight:700, flexShrink:0}}>{pct}%</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const ACTIVITY_ICON = {task_create:'📝', task_update:'✏️', task_delete:'🗑', ai_usage:'🤖'};

function ActivityFeed() {
  const [activities, setActivities] = useState([]);
  useEffect(() => {
    fetch(`${API_BASE}/dashboard/activity/?limit=8`)
      .then(r => r.json()).then(setActivities).catch(() => {});
  }, []);

  const timeAgo = (iso) => {
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return `${mins} хв`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} год`;
    return `${Math.floor(hrs / 24)} дн`;
  };

  if (!activities.length) return null;
  return (
    <div style={{background:DASH.card, border:`1px solid ${DASH.border}`, borderRadius:DASH.rad,
                 padding:16}}>
      <div style={{color:DASH.textDim, fontSize:10, fontWeight:800, letterSpacing:'0.07em',

        <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'6px 0',

            {ACTIVITY_ICON[a.icon] || '•'}

          <span style={{color:DASH.text, fontSize:11.5, flex:1, minWidth:0, overflow:'hidden',
                        textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{a.text}</span>
          <span style={{color:DASH.textDim, fontSize:10, flexShrink:0}}>{timeAgo(a.time)}</span>
        </div>
      ))}
    </div>
  );
}

// ── Вертоліт ────────────────────────────────────────────────────────────────
// Вертолётная видимость: за 5 секунд ответить «всё ли по плану, а если нет —
// где именно пожар». Три уровня чтения сверху вниз: светофор компании →
// 4 измерения со статусами → сортированный список пожаров → здоровье филиалов
// с переходом в обычный дашборд для разбора. Источник: /api/dashboard/helicopter/.
const HELI_DIM_LABELS = {finance:'Фінанси', tasks:'Завдання', branches:'Філії', team:'Команда'};

// Кольцо выполнения плана на карточке филиала. Приём как у TaskDonut:
// в viewBox 36 окружность радиуса 15.9155 имеет длину ровно 100 единиц,
// поэтому stroke-dasharray читается прямо в процентах.
function HeliRing({pct, color}) {
  const filled = Math.max(0, Math.min(pct, 100));
  return (
    <svg width="52" height="52" viewBox="0 0 36 36" style={{flexShrink:0}}>
      <circle cx="18" cy="18" r="15.9155" fill="none" stroke="rgba(25,51,45,0.08)" strokeWidth="3.6"/>
      <circle cx="18" cy="18" r="15.9155" fill="none" stroke={color} strokeWidth="3.6"
              strokeLinecap="round" strokeDasharray={`${filled} 100`}
              transform="rotate(-90 18 18)" style={{transition:'stroke-dasharray .5s ease'}}/>
    </svg>
  );
}

function Heli({settings, period, setPeriod, setSelectedBranch, setNav}) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [openFire, setOpenFire] = useState(null);   // индекс раскрытого пожара
  const [dimFilter, setDimFilter] = useState(null); // фильтр пожаров по измерению

  useEffect(() => {
    let live = true;
    setData(null);
    setErr(null);
    fetch(`${API_BASE}/dashboard/helicopter/?period=${period}`)
      .then(r => { if (!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); })
      .then(d => { if (live) setData(d); })
      .catch(e => { if (live) setErr(e.message); });
    return () => { live = false; };
  }, [period]);

  const card = {borderRadius:DASH.rad, background:DASH.card, border:'1px solid '+DASH.border};

  // Глубокое погружение: выбранный филиал открывается в обычном дашборде
  const diveTo = (branchId) => {
    setSelectedBranch(branchId ?? null);
    setNav({section:'monitor', sub:null});
  };

  if (err) return (
    <div style={{padding:20, background:DASH.bg, minHeight:'100%'}}>
      <div style={{...card, background:DASH.badBg, border:'1px solid '+DASH.badBorder, padding:24, color:DASH.text}}>

    </div>

  const v = data ? data.verdict : null;
  const vColor = v ? statusColor(v.status) : DASH.textDim;
  const allFires = data ? data.fires : [];
  const critN = allFires.filter(f => f.severity === 'critical').length;
  const warnN = allFires.length - critN;
  const fires = dimFilter ? allFires.filter(f => f.dimension === dimFilter) : allFires;

  return (
    <div style={{padding:20, background:DASH.bg, minHeight:'100%'}}>
      <PeriodBar period={period} setPeriod={setPeriod} scopeLabel="Вертоліт"/>

      {!data && (
        <div style={{color:DASH.textDim, padding:'60px 0', textAlign:'center', fontSize:13}}>

        </div>
      )}

      {data && <>
        {/* Уровень 1 — светофор компании */}
        <div className="dash-tile" style={{...card, padding:'24px 28px', display:'flex', alignItems:'center', gap:26, marginBottom:12}}>
          <div style={{width:88, height:88, borderRadius:'50%', background:vColor+'1A',
                       border:`2px solid ${vColor}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
            <div style={{width:46, height:46, borderRadius:'50%', background:vColor,
                         boxShadow:`0 0 26px ${vColor}66`,
                         animation:v.status==='red' ? 'heliPulse 1.6s ease-in-out infinite' : undefined}}/>
          </div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:26, fontWeight:700, color:vColor, lineHeight:1.15,
                         display:'flex', alignItems:'center', gap:12}}>

                <span style={{width:34, height:34, borderRadius:'50%', background:DASH.goodBg,
                              border:`1px solid ${DASH.goodBorder}`, color:DASH.green,
                              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>

                <div style={{width:`${Math.max(v.score, 2)}%`, height:'100%', borderRadius:4, background:vColor, transition:'width .5s ease'}}/>
              </div>
              <span style={{color:DASH.textDim, fontSize:12, fontWeight:600, whiteSpace:'nowrap'}}>{v.score}/100</span>
            </div>

            </div>

// Ключ належить одному наміру зберегти форму, а не одному HTTP-повтору.
function bosFinanceUUID(){
 const random=window.crypto;
 if(typeof random?.randomUUID==='function')return random.randomUUID();
 if(typeof random?.getRandomValues!=='function')throw new Error('Браузер не підтримує безпечний ідентифікатор операції. Відкрийте BoS у сучасному браузері.');
 const bytes=new Uint8Array(16);random.getRandomValues(bytes);
 bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
 const hex=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
 return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
function bosCreateFinanceIntent(){
 let key=null,body=null,owner=null,pending=false;
 const clear=()=>{key=null;body=null;owner=null;};
 return {
  isPending:()=>pending,
  begin(payload){
   if(pending)return null;
   const nextBody=JSON.stringify(payload),scope=bosStorageKey('finance-create');
   if(!key||body!==nextBody||owner!==scope){key=bosFinanceUUID();body=nextBody;owner=scope;}
   pending=true;return {key,body};
  },
  release(){pending=false;},
  reset(){if(pending)return false;clear();return true;},
  complete(){pending=false;clear();}
 };
}
function useFinanceCreateIntent(){const holder=useRef(null);if(!holder.current)holder.current=bosCreateFinanceIntent();return holder.current;}

function Contractors({counterparties, refetch}){
  const EMPTY = {name:'', type:'other', edrpou:'', phone:'', email:'', address:'', notes:''};
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState(EMPTY);

  const byType = filter==='all' ? counterparties : counterparties.filter(c=>c.type===filter);
  const filtered = search.trim()
    ? byType.filter(c=>(c.name||'').toLowerCase().includes(search.toLowerCase()) || (c.edrpou||'').includes(search))
    : byType;
  const totalDebit = counterparties.reduce((s,c)=>s+Number(c.total_debit||0), 0);
  const totalCredit = counterparties.reduce((s,c)=>s+Number(c.total_credit||0), 0);

  const save = (method, url) => {
    if (!form.name.trim()) {alert('Назва обовʼязкова'); return;}
    fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(form)})
      .then(async r=>{
        if(!r.ok){const d=await r.json().catch(()=>null); throw new Error(d&&typeof d==='object'?Object.entries(d).map(([f,e])=>`${f}: ${Array.isArray(e)?e.join(' '):e}`).join('\n'):`Сервер повернув ${r.status}`);}
        return r.json();
      })
      .then(()=>{refetch(); setShowAdd(false); setEditId(null); setForm(EMPTY);})
      .catch(err=>alert('Не вдалося зберегти: '+err.message));
  };
  const startAdd = () => {setForm(EMPTY); setShowAdd(true); setEditId(null);};
  const startEdit = (c) => {setEditId(c.id); setForm({name:c.name,type:c.type,edrpou:c.edrpou||'',phone:c.phone||'',email:c.email||'',address:c.address||'',notes:c.notes||''}); setShowAdd(false);};
  const del = (id) => {
    if(!confirm('Видалити контрагента?'))return;
    fetch(`${API_BASE}/counterparties/${id}/`,{method:'DELETE'})
      .then(r=>{if(!r.ok)throw new Error(`Сервер повернув ${r.status}`); refetch();})

        <Select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>

        <Input placeholder="ЄДРПОУ / ІПН" value={form.edrpou} onChange={e=>setForm(p=>({...p,edrpou:e.target.value}))}/>
        <Input placeholder="Телефон" value={form.phone} onChange={e=>setForm(p=>({...p,phone:e.target.value}))}/>
        <Input placeholder="Email" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))}/>
        <Input placeholder="Адреса" value={form.address} onChange={e=>setForm(p=>({...p,address:e.target.value}))} style={{gridColumn:'span 2'}}/>
      </div>
      <div style={{display:'flex',gap:8}}>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div>
          <h2 style={{color:T.text,margin:0,fontSize:22,fontWeight:700}}>Контрагенти</h2>
          <div style={{color:T.textMuted,fontSize:12,marginTop:4}}>{counterparties.length} записів</div>

        <Button variant="primary" onClick={startAdd}>+ Новий контрагент</Button>
      </div>

      {bosCan('finance')&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:18}}>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Всього дебіт</div><div style={{color:T.primary,fontWeight:700,fontSize:18}}>{fmt(totalDebit,'UAH')}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Всього кредит</div><div style={{color:T.red,fontWeight:700,fontSize:18}}>{fmt(totalCredit,'UAH')}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Баланс</div><div style={{color:totalDebit-totalCredit>=0?T.primary:T.red,fontWeight:700,fontSize:18}}>{fmt(totalDebit-totalCredit,'UAH')}</div></Card>
      </div>}

      {showAdd && renderForm(()=>save('POST',`${API_BASE}/counterparties/`), ()=>setShowAdd(false))}

      </div>

      <Card pad={4}>
        <div style={{display:'grid',gridTemplateColumns:bosCan('finance')?'2fr 1fr 1fr 1fr 1fr 1fr 80px':'2fr 1fr 1fr 80px',gap:12,padding:'12px 16px',borderBottom:'1px solid '+T.border}}>
          {(bosCan('finance')?['Назва','Тип','ЄДРПОУ','Дебіт','Кредит','Баланс','']:['Назва','Тип','ЄДРПОУ','']).map((h,i)=><span key={i} style={{color:T.textMuted,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</span>)}

              <span style={{color:T.red,fontSize:13,fontWeight:600}}>{fmt(Number(c.total_credit||0),'UAH')}</span>

                <Button variant="ghost" onClick={()=>del(c.id)} title="Видалити" style={{color:T.red,fontSize:14,padding:'4px 8px',borderRadius:6}}>×</Button>

            {editId===c.id && <div style={{padding:'14px 16px',borderBottom:'1px solid '+T.border,background:T.surfaceHover}}>{renderForm(()=>save('PATCH',`${API_BASE}/counterparties/${c.id}/`), ()=>setEditId(null))}</div>}
          </React.Fragment>
          );
        })}
        {filtered.length===0&&<div style={{padding:40,textAlign:'center',color:T.textMuted,fontSize:13}}>{search?'Нічого не знайдено':'Немає контрагентів'}</div>}

    </div>
  );
}

const CT_CATS = {services:'Послуги', goods:'Товари', utility:'Комунальні', rent:'Оренда', supply:'Закупівля', other:'Інше'};
const CT_STATUS = {active:'Активний', closed:'Закритий', draft:'Чернетка'};

function Contracts({contracts, counterparties, refetch}){
  const EMPTY = {number:'', name:'', counterparty:'', category:'other', status:'active', amount:'', start_date:'', end_date:'', notes:''};
  const [status, setStatus] = useState('all');
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState(EMPTY);

  const filtered = contracts.filter(c => {
    if (status !== 'all' && c.status !== status) return false;
    if (cat !== 'all' && c.category !== cat) return false;
    if (search.trim()) {
      const q = search.toLowerCase();
      const hit =
        (c.number || '').toLowerCase().includes(q) ||
        (c.name || '').toLowerCase().includes(q) ||
        (c.counterparty_name || '').toLowerCase().includes(q);
      if (!hit) return false;
    }
    return true;
  });
  const totalActive = contracts.filter(c=>c.status==='active').reduce((s,c)=>s+Number(c.amount||0), 0);

  const save = (method, url) => {
    if (!form.number.trim() || !form.name.trim()) {alert('Номер та назва обовʼязкові'); return;}
    if (!form.counterparty) {alert('Оберіть контрагента'); return;}
    const body = {...form, amount: form.amount||0, start_date: form.start_date||null, end_date: form.end_date||null};
    fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(async r=>{
        if(!r.ok){const d=await r.json().catch(()=>null); throw new Error(d&&typeof d==='object'?Object.entries(d).map(([f,e])=>`${f}: ${Array.isArray(e)?e.join(' '):e}`).join('\n'):`Сервер повернув ${r.status}`);}
        return r.json();
      })
      .then(()=>{refetch(); setShowAdd(false); setEditId(null); setForm(EMPTY);})
      .catch(err=>alert('Не вдалося зберегти: '+err.message));
  };
  const startAdd = () => {setForm(EMPTY); setShowAdd(true); setEditId(null);};
  const startEdit = (c) => {setEditId(c.id); setForm({number:c.number,name:c.name,counterparty:c.counterparty,category:c.category,status:c.status,amount:c.amount,start_date:c.start_date||'',end_date:c.end_date||'',notes:c.notes||''}); setShowAdd(false);};
  const del = (id) => {
    if(!confirm('Видалити договір?'))return;
    fetch(`${API_BASE}/contracts/${id}/`,{method:'DELETE'})
      .then(r=>{if(!r.ok)throw new Error(`Сервер повернув ${r.status}`); refetch();})
      .catch(err=>alert('Не вдалося видалити: '+err.message));
  };

  const renderForm = (onSave, onCancel) => (
    <Card pad={18} style={{marginBottom:16}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        <Input placeholder="Номер *" value={form.number} onChange={e=>setForm(p=>({...p,number:e.target.value}))}/>
        <Input placeholder="Назва *" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/>
        <Select value={form.counterparty} onChange={e=>setForm(p=>({...p,counterparty:e.target.value}))} style={{gridColumn:'span 2'}}>
          <option value="">Оберіть контрагента *</option>
          {counterparties.map(c=><option key={c.id} value={c.id}>{c.name} ({CP_TYPES[c.type]||c.type})</option>)}
        </Select>
        <Select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>
          {Object.entries(CT_CATS).map(([k,l])=><option key={k} value={k}>{l}</option>)}
        </Select>
        <Select value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))}>
          {Object.entries(CT_STATUS).map(([k,l])=><option key={k} value={k}>{l}</option>)}
        </Select>
        <Input type="number" placeholder="Сума" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}/>
        <div style={{display:'flex',gap:8}}>
          <Input type="date" value={form.start_date} onChange={e=>setForm(p=>({...p,start_date:e.target.value}))} style={{flex:1}}/>
          <Input type="date" value={form.end_date} onChange={e=>setForm(p=>({...p,end_date:e.target.value}))} style={{flex:1}}/>
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <Button variant="primary" onClick={onSave} style={{padding:'8px 16px'}}>Зберегти</Button>
        <Button variant="subtle" onClick={onCancel} style={{padding:'8px 16px'}}>Скасувати</Button>
      </div>
    </Card>
  );

  return(
    <div className="bos-contracts" style={{padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div>
          <h2 style={{color:T.text,margin:0,fontSize:22,fontWeight:700}}>Договори</h2>
          <div style={{color:T.textMuted,fontSize:12,marginTop:4}}>{contracts.length} договорів</div>
        </div>
        <Button variant="primary" onClick={startAdd}>+ Новий договір</Button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:18}}>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Активних</div><div style={{color:T.text,fontWeight:700,fontSize:22}}>{contracts.filter(c=>c.status==='active').length}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Закритих</div><div style={{color:T.textMuted,fontWeight:700,fontSize:22}}>{contracts.filter(c=>c.status==='closed').length}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Сума (активних)</div><div style={{color:T.primary,fontWeight:700,fontSize:18}}>{fmt(totalActive,'UAH')}</div></Card>
      </div>

      {showAdd && renderForm(()=>save('POST',`${API_BASE}/contracts/`), ()=>setShowAdd(false))}

      <div style={{marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
        <SegmentedControl value={status} onChange={setStatus}
          options={[['all','Всі'],...Object.entries(CT_STATUS)].map(([k,l])=>({key:k,label:l}))}/>
        <div className="erp-search-row"><Input aria-label="Пошук договорів" placeholder="Пошук..." value={search} onChange={e=>setSearch(e.target.value)}/><Button onClick={refetch}>Оновити</Button></div>
      </div>
      <div style={{marginBottom:14}}>
        <SegmentedControl size="sm" value={cat} onChange={setCat}
          options={[['all','Всі'],...Object.entries(CT_CATS)].map(([k,l])=>({key:k,label:l}))}/>
      </div>

      <Card pad={4}>
        <div style={{display:'grid',gridTemplateColumns:'0.8fr 2fr 1.5fr 1fr 1.2fr 1fr 80px',gap:12,padding:'12px 16px',borderBottom:'1px solid '+T.border}}>
          {['№','Назва','Контрагент','Категорія','Сума','Статус',''].map((h,i)=><span key={i} style={{color:T.textMuted,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</span>)}
        </div>
        {filtered.map(c=>(
          <React.Fragment key={c.id}>
            <div style={{display:'grid',gridTemplateColumns:'0.8fr 2fr 1.5fr 1fr 1.2fr 1fr 80px',gap:12,padding:'12px 16px',borderBottom:editId===c.id?'none':'1px solid '+T.border,alignItems:'center'}}>
              <span style={{color:T.textMuted,fontSize:12}}>{c.number}</span>
              <div><div style={{color:T.text,fontSize:13,fontWeight:500}}>{c.name}</div><div style={{color:T.textDim,fontSize:10,marginTop:2}}>{c.start_date||'—'} – {c.end_date||'—'}</div></div>
              <span style={{color:T.textMuted,fontSize:12}}>{c.counterparty_name||'—'}</span>
              <span><Badge tone="accent">{CT_CATS[c.category]||c.category}</Badge></span>
              <span style={{color:T.text,fontSize:13,fontWeight:700}}>{fmt(Number(c.amount||0),'UAH')}</span>
              <span><Badge tone={c.status==='active'?'accent':'neutral'}>{CT_STATUS[c.status]||c.status}</Badge></span>
              <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                <Button variant="ghost" onClick={()=>startEdit(c)} title="Редагувати" style={{color:T.textMuted,fontSize:13,padding:'4px 8px',borderRadius:6}}>✎</Button>
                <Button variant="ghost" onClick={()=>del(c.id)} title="Видалити" style={{color:T.red,fontSize:14,padding:'4px 8px',borderRadius:6}}>×</Button>
              </div>
            </div>
            {editId===c.id && <div style={{padding:'14px 16px',borderBottom:'1px solid '+T.border,background:T.surfaceHover}}>{renderForm(()=>save('PATCH',`${API_BASE}/contracts/${c.id}/`), ()=>setEditId(null))}</div>}
          </React.Fragment>
        ))}
        {filtered.length===0&&<div style={{padding:40,textAlign:'center',color:T.textMuted,fontSize:13}}>Немає договорів</div>}
      </Card>
    </div>
  );
}

const SAL_STATUS = {pending:'Очікує', paid:'Виплачено', cancelled:'Скасовано'};
const salStatusColor = (s) => s==='paid'?T.primary : s==='pending'?T.yellow : T.textMuted;
const MONTHS_UA = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

function Salaries({salaries, employees, refetch, refetchTransactions}){
  const now = new Date();
  const EMPTY = {employee:'', amount:'', period_year:now.getFullYear(), period_month:now.getMonth()+1, notes:''};
  const [statusF, setStatusF] = useState('all');
  const [search, setSearch] = useState('');
  const [employeeF, setEmployeeF] = useState('all');           // фильтр по сотруднику (id или 'all')
  const [periodF, setPeriodF] = useState('all');               // 'all' или 'YYYY-MM'
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState(EMPTY);
  const [saving,setSaving]=useState(false),[createError,setCreateError]=useState('');
  const createIntent=useFinanceCreateIntent();
  const editField=(key,value)=>{if(createIntent.isPending())return;if(form[key]!==value)createIntent.reset();setForm(p=>({...p,[key]:value}));setCreateError('');};
  const toggleCreate=()=>{if(!createIntent.reset())return;if(!showAdd)setForm(EMPTY);setCreateError('');setShowAdd(p=>!p);};
  const cancelCreate=()=>{if(!createIntent.reset())return;setShowAdd(false);setCreateError('');};

  const filtered = salaries.filter(s => {
    if (statusF !== 'all' && s.status !== statusF) return false;
    if (employeeF !== 'all' && String(s.employee) !== String(employeeF)) return false;
    if (periodF !== 'all') {
      const [yy, mm] = periodF.split('-');
      if (String(s.period_year) !== yy || String(s.period_month).padStart(2,'0') !== mm) return false;
    }
    if (search.trim()) {
      const q = search.toLowerCase();
      const hit =
        (s.employee_name || '').toLowerCase().includes(q) ||
        (s.employee_role || '').toLowerCase().includes(q) ||
        (s.employee_dept || '').toLowerCase().includes(q);
      if (!hit) return false;
    }
    return true;
  });
  const uniquePeriods = [...new Set(salaries.map(s => `${s.period_year}-${String(s.period_month).padStart(2,'0')}`))].sort().reverse();
  const sumBy = (pred) => salaries.filter(pred).reduce((s,x)=>s+Number(x.amount||0), 0);
  const totalAll = sumBy(()=>true);
  const totalPaid = sumBy(s=>s.status==='paid');
  const totalPending = sumBy(s=>s.status==='pending');

  const add = async () => {
    if(createIntent.isPending())return;
    if (!form.employee || !form.amount) {setCreateError('Оберіть співробітника та вкажіть суму');return;}
    setCreateError('');
    let confirmed=false;
    try{
      const request=createIntent.begin({employee:form.employee,amount:form.amount,period_year:Number(form.period_year),period_month:Number(form.period_month),notes:form.notes});
      if(!request)return;
      setSaving(true);
      const response=await fetch(`${API_BASE}/salaries/`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':request.key},body:request.body});
      const data=await response.json();
      if(!response.ok)throw new Error(data&&typeof data==='object'?Object.entries(data).map(([field,value])=>`${field}: ${Array.isArray(value)?value.join(' '):value}`).join('\n'):`Сервер повернув ${response.status}`);
      confirmed=true;createIntent.complete();setShowAdd(false);setForm(EMPTY);
    }catch(error){setCreateError('Не вдалося нарахувати: '+error.message);}
    finally{createIntent.release();setSaving(false);}
    if(confirmed)refetch();
  };
  const pay = (id) => {
    fetch(`${API_BASE}/salaries/${id}/pay/`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
      .then(async r=>{ if(!r.ok){const d=await r.json().catch(()=>null); throw new Error((d&&d.error)||`Сервер повернув ${r.status}`);} return r.json(); })
      .then(()=>{refetch(); refetchTransactions && refetchTransactions();})
      .catch(err=>alert('Не вдалося виплатити: '+err.message));
  };
  const del = (id) => {
    if(!confirm('Архівувати нарахування? Виплата та її джерело залишаться в історії.'))return;
    fetch(`${API_BASE}/salaries/${id}/`,{method:'DELETE'})
      .then(r=>{if(!r.ok)throw new Error(`Сервер повернув ${r.status}`); refetch();})
      .catch(err=>alert('Не вдалося видалити: '+err.message));
  };

  return(
    <div className="bos-salaries" style={{padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div>
          <h2 style={{color:T.text,margin:0,fontSize:22,fontWeight:700}}>Зарплати команди</h2>
          <div style={{color:T.textMuted,fontSize:12,marginTop:4}}>{salaries.length} нарахувань</div>
        </div>
        <Button variant="primary" onClick={toggleCreate} disabled={saving}>{showAdd?'Закрити':'+ Нарахувати зарплату'}</Button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:18}}>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Всього нараховано</div><div style={{color:T.text,fontWeight:700,fontSize:18}}>{fmt(totalAll,'UAH')}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Виплачено</div><div style={{color:T.primary,fontWeight:700,fontSize:18}}>{fmt(totalPaid,'UAH')}</div></Card>
        <Card pad={16}><div style={{color:T.textMuted,fontSize:12,marginBottom:6}}>Очікує виплати</div><div style={{color:T.yellow,fontWeight:700,fontSize:18}}>{fmt(totalPending,'UAH')}</div></Card>
      </div>

      {showAdd && (
        <Card pad={18} style={{marginBottom:16}}>
          <fieldset disabled={saving} style={{border:0,padding:0,margin:0,minWidth:0}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
            <Select value={form.employee} onChange={e=>editField('employee',e.target.value)} style={{gridColumn:'span 2'}}>
              <option value="">Оберіть співробітника *</option>
              {employees.map(e=><option key={e.id} value={e.id}>{e.name} — {e.dept||'—'}</option>)}
            </Select>
            <Input type="number" placeholder="Сума *" value={form.amount} onChange={e=>editField('amount',e.target.value)}/>
            <div style={{display:'flex',gap:8}}>
              <Select value={form.period_month} onChange={e=>editField('period_month',e.target.value)} style={{flex:1}}>
                {MONTHS_UA.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
              </Select>
              <Input type="number" value={form.period_year} onChange={e=>editField('period_year',e.target.value)} style={{width:90}}/>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>

// Кастомный pill-select со стрелкой ▾ и hover-эффектом.
// Используется в таблице доручень для priority и status — даёт визуальное affordance
// что это кликабельный select, а не статичный pill.
function PillSelect({value, color, onChange, options}) {
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
         style={{position:'relative', display:'inline-flex', alignItems:'center'}}>
      <select value={value} onChange={onChange}
              style={{
                background: hover ? color+'33' : color+'22',
                color: color,
                fontSize: 11, fontWeight: 600,
                padding:'4px 22px 4px 10px',
                borderRadius: 6,
                border:'1px solid '+color+'44',
                cursor:'pointer',
                appearance:'none', WebkitAppearance:'none', MozAppearance:'none',
                outline:'none',
                transition:'background 0.15s',
              }}>
        {options.map(o => (
          <option key={o.value} value={o.value} style={{background: T.surfaceSolid, color: T.text}}>
            {o.label}
          </option>
        ))}
      </select>
      {/* Стрелочка вниз — overlay поверх select, не перехватывает клики */}
      <span style={{position:'absolute', right: 6, top:'50%', transform:'translateY(-50%)', color: color, fontSize: 9, pointerEvents:'none'}}>▾</span>
    </div>
  );
}

// Presentation only: consume the existing guarded list and directory projections.
function c01TaskCardFacts(task,employees=[],departments=[]){
 const text=value=>typeof value==='string'&&value.trim()?value.trim():null;
 const orderId=c01Id(task.order_id)?task.order_id:null;
 const employee=c01Id(task.assignee_id)?employees.find(e=>e.id===task.assignee_id):null;
 const department=c01Id(employee?.branch)?departments.find(d=>d.id===employee.branch):null;
 const facts={
  orderLabel:orderId?(text(task.order_code)?text(task.order_code)+' · №'+orderId:'№'+orderId):'Поточне замовлення не прив’язано',
  assigneeDepartment:department?(text(department.name)||'Без назви')+' · №'+department.id:'Не визначено в доступному довіднику',
  businessBranch:text(task.branch_name)||'Не визначено',
  handoffLabel:'Відомостей про передачу немає',recipientId:null,recipientDepartment:null
 };
 const h=task.handoff;
 if(h==null)return facts;
 if(!c01HandoffShape(h)||typeof h.current!=='boolean'){
  facts.handoffLabel='Відомості про передачу не підтверджено';return facts;
 }
 const current=h.state==='sent'&&h.current===true&&h.recipient.employee_id===task.assignee_id;
 const previous=h.state==='superseded'&&h.current===false;
 facts.handoffLabel=current?'Призначення чинне':previous?'Попереднє призначення':'Чинність призначення не підтверджено';
 facts.recipientId=h.recipient.employee_id;
 facts.recipientDepartment=(text(h.recipient.department.name)||'Без назви')+' · №'+h.recipient.department.id;
 return facts;
}
