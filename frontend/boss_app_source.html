      .then(data=>{
        const mapped=data.map(e=>({
          id:e.id,
          name:e.full_name,
          role:e.role,
          dept:e.department,
          birthday:e.birthday,
          archived_at:e.archived_at,
          kpi:e.kpi,
          phone:e.phone,
          email:e.email,
          avatar:genAvatar(e.full_name),
        }));
        setEmployees(mapped);
        setEmployeesLoading(false);
      })
      .catch(err=>{
        console.error('Не вдалося завантажити співробітників:',err);
        setEmployeesError(err.message||'Помилка зʼєднання');
        setEmployeesLoading(false);
      });
  };

  useEffect(()=>{refetchEmployees();},[]);

  // Reusable function — pull tasks from API and update state.
  // Called on mount, after AI tool-use replies, and from the "Retry" button on errors.
  const refetchTasks=()=>{
    setTasksLoading(true);setTasksError(null);
    fetch(`${API_BASE}/tasks/`)
      .then(r=>{
        // r.ok is false for 4xx/5xx — fetch only rejects on network failure, so we check manually
        if(!r.ok) throw new Error(`Сервер повернув ${r.status}`);
        return r.json();
      })
      .then(data=>{if(!Array.isArray(data))throw new Error('Некоректний список доручень');setTasks(data);setTasksLoading(false);})
      .catch(err=>{
        console.error('Не вдалося завантажити доручення:',err);
        setTasksError(err.message||'Помилка зʼєднання');
        setTasksLoading(false);
      });
  };

  useEffect(()=>{refetchTasks();},[]);

  // Finance refetch functions (Step 11) — по образцу refetchTasks
  const refetchCounterparties = () => {
    fetch(`${API_BASE}/counterparties/`).then(r=>{ if(!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); }).then(setCounterparties).catch(err=>setDataError('Не вдалося оновити дані: '+err.message));
  };
  const refetchContracts = () => {
    fetch(`${API_BASE}/contracts/`).then(r=>{ if(!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); }).then(setContracts).catch(err=>setDataError('Не вдалося оновити дані: '+err.message));
  };
  const refetchTransactions = () => {
    if(bosRole()==='observer'){setTransactions([]);return;}
    fetch(`${API_BASE}/transactions/`).then(r=>{ if(!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); }).then(setTransactions).catch(err=>setDataError('Не вдалося оновити дані: '+err.message));
  };
  const refetchSalaries = () => {
    if(!bosCan('finance')){setSalaries([]);return;}
    fetch(`${API_BASE}/salaries/`).then(r=>{ if(!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); }).then(setSalaries).catch(err=>setDataError('Не вдалося оновити дані: '+err.message));
  };
  // Одним вызовом обновить все финансы — передаём в AIChat (AI может менять финансы через tools)
  const refetchFinance = () => {
    refetchCounterparties(); refetchContracts();
    if(bosRole()!=='observer')refetchTransactions();else setTransactions([]);
    if(bosCan('finance'))refetchSalaries();else setSalaries([]);
  };
  useEffect(()=>{refetchFinance();},[]);

  // CEO Dashboard — fetch branches list (for tree) + aggregated summary
  const refetchBranches = () => {
    fetch(`${API_BASE}/branches/`).then(r=>{ if(!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); }).then(data => {
      // API returns nested tree; flatten for easy lookup
      const flat = [];
      const walk = (items) => { items.forEach(b => { flat.push(b); if (b.children && b.children.length) walk(b.children); }); };
      walk(data);
      setBranches(flat);
    }).catch(err=>setDataError('Не вдалося оновити дані: '+err.message));
  };
  const refetchDashboard = (branchId, per) => {
    const sequence=++dashboardSequence.current;
    const qs = new URLSearchParams({period: per || 'month'});
    if (branchId) qs.set('branch_id', branchId);
    fetch(`${API_BASE}/dashboard/summary/?${qs}`)
      .then(r => { if (!r.ok) throw new Error(`Сервер повернув ${r.status}`); return r.json(); })
      .then(d=>{if(sequence===dashboardSequence.current)setBranchData(d);})
      .catch(err => {if(sequence===dashboardSequence.current){setBranchData(null);setDataError('Дашборд: '+err.message);}});
  };
  useEffect(() => { refetchBranches(); }, []);
  // Один эффект на выбор филиала И период — иначе смена периода при выбранном
  // филиале давала бы два запроса подряд и мигание цифр.
  useEffect(() => { refetchDashboard(selectedBranch, period); }, [selectedBranch, period]);

  if(screen==='onboarding') return <Onboarding onComplete={ind=>{
    localStorage.setItem(bosStorageKey('industry'),JSON.stringify(ind));  // remember choice across page reloads
    setIndustry(ind);
    setScreen('app');
  }}/>;

  const theme=THEMES[settings.theme]||THEMES.purple;
  const {section}=nav;
  const sub=nav.sub||bosNavigation().find(n=>n.id===section)?.subs[0]?.id||null;

  const renderContent=()=>{
    if(!bosCanView(section,sub)){if(section==='hr'&&sub==='kpi')return <KPI employees={[]} loading={false} error={null} refetchEmployees={refetchEmployees} denied/>;return <div className="erp-workspace"><Card><h2>Розділ недоступний</h2><p>Поточний обліковий запис не має доступу до цього розділу.</p><Button onClick={()=>setNav({section:'monitor',sub:null})}>Відкрити моніторинг</Button></Card></div>;}
    if(section==='monitor') return <Monitoring onNavigate={(section,sub)=>setNav({section,sub})}/>;
    if(section==='structure') return <ERPWorkspace view="network" refetchTasks={refetchTasks} onNavigate={(section,sub)=>setNav({section,sub})}/>;
    if(section==='erp')return <OperationsWorkspace sub={sub||'sales'} extra={nav.extra} refetchTasks={refetchTasks} onNavigate={(section,sub)=>setNav({section,sub})} employees={employees} crmHandoff={crmHandoff} onClearHandoff={()=>setCrmHandoff(null)}/>;
    if(section==='documents') return <DocumentRegistry/>;
    if(section==='connectors') return <Connections/>;
    if(section==='finance')return <FinanceWorkspace sub={sub} settings={settings} transactions={transactions} counterparties={counterparties} contracts={contracts} salaries={salaries} employees={employees} refetchTasks={refetchTasks} onNavigate={(section,sub)=>setNav({section,sub})} refetchTransactions={refetchTransactions} refetchCounterparties={refetchCounterparties} refetchContracts={refetchContracts} refetchSalaries={refetchSalaries}/>;
    if(section==='hr'){
      if(sub==='tasks'||!sub) return <Tasks tasks={tasks} setTasks={setTasks} loading={tasksLoading} error={tasksError} refetchTasks={refetchTasks}/>;
      if(sub==='employees'&&!bosCan('hr_private'))return <BoSReadOnlyRecords title="Довідник співробітників" rows={employees} columns={[["Ім’я",'name'],["Посада",'role'],["Відділ",'dept'],["Стан",r=>r.archived_at?'В архіві':'Активний']]} onRefresh={refetchEmployees} loading={employeesLoading} error={employeesError}/>;
      if(sub==='employees') return <Employees employees={employees} setEmployees={setEmployees} depts={settings.departments} loading={employeesLoading} error={employeesError} refetchEmployees={refetchEmployees}/>;
      if(sub==='birthdays') return <Birthdays employees={employees}/>;
      if(sub==='kpi') return <KPI employees={employees} loading={employeesLoading} error={employeesError} refetchEmployees={refetchEmployees}/>;
    }
    if(section==='organizer'){
      if(sub==='documents')return <DocumentRegistry/>;
      if(sub==='journal')return <ActionJournal/>;
      if(sub==='schedule'||!sub) return <Schedule/>;
      if(sub==='notes') return <Notes notes={notes} setNotes={setNotes}/>;
      if(sub==='reports') return <Reports/>;
    }
    if(section==='ai'){
      if(sub==='aichat'||!sub) return <AIChat refetchTasks={refetchTasks} refetchEmployees={refetchEmployees} refetchFinance={refetchFinance}/>;
      if(sub==='audiomeeting') return <AudioMeeting/>;
      if(sub==='dictaphone') return <Dictaphone/>;
    }
    if(section==='info') return <Bos3TrainingHub tourState={trainingTour} setTourState={setTrainingTour} onNavigate={(section,sub)=>setNav({section,sub})} onOpenCRM={context=>{setCrmHandoff(context);setNav({section:'crm',sub:null});}}/>;
    if(section==='crm') return <CRMWorkspace employees={employees} handoffContext={crmHandoff} onClearHandoff={()=>setCrmHandoff(null)}/>;
    if(section==='settings') return <>{bosRole()==='ceo'&&<div style={{padding:24,paddingBottom:0}}><OrganizationSettings/></div>}<Settings settings={settings} setSettings={setSettings} employees={employees} setEmployees={setEmployees} industry={industry} setIndustry={setIndustry} onNavigate={(section,sub)=>setNav({section,sub})}/></>;
    return null;
  };

  return(
    <div className="bos-app" style={{display:'flex', flexDirection:'column', height:'100dvh', background:'transparent', fontFamily:T.font, overflow:'hidden'}}>
      <a className="bos-skip" href="#bos-workspace">До вмісту</a>
      {/* Ряд 1 — навигационная полоса (лого + icon-пилюли + колокольчик/AI/аватар) */}
      <div className="op-mode"><span>{window.BOS_RUNTIME?.mode==='demo'?'Демо-компанія · дані на '+window.BOS_RUNTIME.as_of.split('-').reverse().join('.'):'Робочий простір'} · BoS</span>{window.BOS_RUNTIME?.mode==='demo'&&!window.BOS_RUNTIME?.training_enabled?<label>Роль <select value={opRole} onChange={async e=>{try{await opFetch('role/',{role:e.target.value});location.reload();}catch(err){setNotice(err.message);}}}><option value="ceo">Керівник</option><option value="manager">Менеджер</option><option value="observer">Спостерігач</option></select></label>:<span>{{ceo:'Керівник',manager:'Менеджер',observer:'Спостерігач'}[opRole]}</span>}<button onClick={async()=>{const r=await fetch('/api/auth/logout/',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(r.ok)location.reload();else setNotice('Не вдалося завершити сесію. Повторіть дію.');}}>Вийти</button></div>
      <NavBar nav={nav} setNav={setNav} settings={settings} aiPanelOpen={aiPanelOpen} setAiPanelOpen={setAiPanelOpen} tasks={tasks} aiConfigured={aiConfigured}/>
      {/* Под навигацией: центральная колонка (суб-бар + контент) и AI-панель справа */}
      <div style={{flex:1, minHeight:0, display:'flex', overflow:'hidden'}}>
        <div style={{flex:1, minWidth:0, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <Topbar nav={nav} setNav={setNav} tasks={tasks} employees={employees} contracts={contracts} counterparties={counterparties} onCreated={()=>{refetchTasks();refetchDashboard(selectedBranch,period);setNotice("Доручення збережено");}}/>
          {(dataError||notice)&&<div className="bos-feedback" role="status">{dataError||notice}{dataError&&<button onClick={()=>{setDataError(null);refetchFinance();refetchBranches();refetchDashboard(selectedBranch,period);}}>Повторити</button>}<button onClick={()=>{setDataError(null);setNotice('');}}>Закрити</button></div>}
          <main id="bos-workspace" data-bos-main tabIndex={-1} style={{flex:1, overflowY:'auto', overflowX:'hidden'}}><ERPConfirmRecovery/>{['erp','finance'].includes(section)&&<WorkspaceTabs section={section} active={sub} onNavigate={(section,sub)=>setNav({section,sub})}/>} {renderContent()}</main>
        </div>
        {/* AI-панель — появляется/исчезает по toggle */}
      </div>
    </div>
  );
}

// BoS 4 «Моніторинг»: numbers, standard queries and tables. Read-only.
const MON_KIND={order:'orders',lot:'lots',purchase:'purchases',invoice:'invoices'};
function monValue(v){if(typeof v==='number')return v.toLocaleString('uk-UA');if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))return v.split('-').reverse().join('.');return v;}
const MON_LEVEL={danger:'Терміново',warning:'Увага'};
function MonAttention({items,onOpen}){
 return <section className="mon-card mon-attention" aria-label="Потребує уваги"><header><h2>Потребує уваги</h2><span>{items.length}</span></header>
  {items.length?<ul>{items.map((a,i)=><li key={i} data-level={a.level}><button type="button" onClick={()=>onOpen(a.ref)}><b>{MON_LEVEL[a.level]||'Увага'}</b><span><strong>{a.title}</strong><small>{a.detail}</small></span><em>Відкрити →</em></button></li>)}</ul>
  :<p className="mon-ok">Усе гаразд: прострочень і блокувань немає.</p>}
 </section>;
}
function MonTable({table,onRow}){
 return <section className="mon-card"><header><h2>{table.title}</h2><span>{table.total}</span></header>
  {table.rows.length?<div className="erp-table" tabIndex={0}><table><thead><tr>{table.columns.map(c=><th key={c}>{c}</th>)}</tr></thead>
   <tbody>{table.rows.map((r,i)=><tr key={i} className={'bos-click-row'+(r.late?' mon-late':'')} tabIndex={0} onClick={()=>onRow(r.ref)} onKeyDown={e=>{if(e.key==='Enter')onRow(r.ref);}}>{r.cells.map((c,j)=><td key={j}>{monValue(c)}</td>)}</tr>)}</tbody></table></div>
  :<p className="op-muted mon-empty">Немає записів</p>}
 </section>;
}
function Monitoring({onNavigate}){
 const [data,setData]=useState(null),[error,setError]=useState(''),[result,setResult]=useState(null),[snapshot,setSnapshot]=useState(null),[selection,setSelection]=useState(null);
 const load=async()=>{try{setData(await erpFetch('monitoring/'));setError('');}catch(e){setError(e.message);}};
 useEffect(()=>{load();window.addEventListener('bos:data-changed',load);return()=>window.removeEventListener('bos:data-changed',load);},[]);
 const ask=async key=>{try{setResult(await erpFetch('monitoring/query/'+key+'/'));setError('');}catch(e){setError(e.message);}};
 const open=async ref=>{
  if(ref.kind==='task'){onNavigate('hr','tasks');return;}
  try{const d=snapshot||await erpFetch('snapshot/');setSnapshot(d);setSelection({kind:MON_KIND[ref.kind],id:ref.id});}catch(e){setError(e.message);}
 };
 if(!data)return <div className="mon"><p>{error||'Завантаження…'}</p>{error&&<Button onClick={load}>Повторити</Button>}</div>;
 return <div className="mon">
  <div className="mon-numbers">{data.numbers.map(n=><div key={n.key} className={'mon-number'+(n.alert?' mon-alert':'')}><strong>{monValue(n.value)}</strong><span>{n.label}</span></div>)}</div>
  {data.attention&&<MonAttention items={data.attention} onOpen={open}/>}
  <div className="mon-queries" role="group" aria-label="Стандартні запити">{data.queries.map(q=><button key={q.key} type="button" aria-pressed={result?.key===q.key} onClick={()=>ask(q.key)}>{q.title}</button>)}</div>
  {error&&<p role="alert" className="erp-error">{error}</p>}
  {result&&<div className="mon-result"><MonTable table={result} onRow={open}/><Button onClick={()=>setResult(null)}>Закрити</Button></div>}
  <div className="mon-grid">{data.tables.map(t=><MonTable key={t.key} table={t} onRow={open}/>)}</div>
  {selection&&snapshot&&<BoSInspector selection={selection} data={snapshot} readOnly onClose={()=>setSelection(null)} onSelect={setSelection} onAction={()=>{}} onNavigate={onNavigate}/>}
 </div>;
}

// BoS 4 «Підключення»: connect services the company already uses. Read-only import.
function Connections(){
 const [data,setData]=useState(null),[error,setError]=useState(''),[open,setOpen]=useState(null),[form,setForm]=useState({kind:'csv',name:'',dataset:'orders',url:''}),[preview,setPreview]=useState(null),[busy,setBusy]=useState(false),[failed,setFailed]=useState([]);
 const fileRef=useRef(null),entry=useRef(null);
 const call=async(path,body)=>{const r=await fetch('/api/connectors/'+path,body?{method:'POST',body}:{});let d;try{d=await r.json();}catch{throw Error('Сервіс підключень недоступний.');}if(!r.ok)throw Error(d.error||'Не вдалося виконати запит.');return d;};
 const current=scope=>entry.current===scope&&scope===bosHttpScope();
 const load=async(note='')=>{const scope=entry.current;try{const list=await call('');if(current(scope)){setData(list);setError(note);}}catch(e){if(current(scope))setError(e.message);}};
 useEffect(()=>{const scope=bosHttpScope();entry.current=scope;(async()=>{let note='';if(bosCan('write')){try{const result=await call('sync-stale/',new FormData());if(current(scope))setFailed(result.failed||[]);}catch(e){note=e.message;}}if(current(scope))await load(note);})();return()=>{entry.current=null;};},[]);
 const source=()=>{const f=new FormData();f.append('kind',form.kind);if(form.kind==='csv'){const file=fileRef.current?.files?.[0];if(!file)throw Error('Оберіть файл .xlsx або .csv.');f.append('file',file);}else f.append('url',form.url.trim());return f;};
 const run=async fn=>{if(busy)return;setBusy(true);setError('');try{await fn();}catch(e){setError(e.message);}finally{setBusy(false);}};
 const doPreview=()=>run(async()=>setPreview(await call('preview/',source())));
 const doCreate=()=>run(async()=>{const f=source();f.append('name',form.name.trim());f.append('dataset',form.dataset);f.append('expected_sha256',preview.sha256);await call('create/',f);setPreview(null);setForm({kind:'csv',name:'',dataset:'orders',url:''});if(fileRef.current)fileRef.current.value='';await load();});
 const doSync=id=>run(async()=>{await call(id+'/sync/',new FormData());setFailed(rows=>rows.filter(row=>row.id!==id));await load();});
 const doDisable=id=>run(async()=>{await call(id+'/disable/',new FormData());setOpen(null);await load();});
 const show=id=>run(async()=>setOpen(await call(id+'/rows/')));
 if(!data)return <div className="mon"><p>{error||'Завантаження…'}</p>{error&&<Button onClick={()=>load()}>Повторити</Button>}</div>;
 const when=v=>v?new Date(v).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
 return <div className="mon">
  {error&&<p role="alert" className="erp-error">{error}</p>}
  <section className="mon-card"><header><h2>Підключені джерела</h2><span>{data.connectors.length}</span></header>
   {data.connectors.length?<div className="erp-table"><table><thead><tr><th>Назва</th><th>Сервіс</th><th>Дані</th><th>Стан</th><th>Оновлено</th><th>Рядків</th><th></th></tr></thead><tbody>{data.connectors.map(c=>{const failure=failed.find(row=>row.id===c.id);return <tr key={c.id} className={(bosCan('write')?'bos-click-row':'')+(failure||c.status==='error'?' mon-late':'')} onClick={bosCan('write')?e=>{if(!e.target.closest('button'))show(c.id);}:undefined}><td>{c.name}</td><td>{data.catalog.find(x=>x.kind===c.kind)?.title||c.kind}</td><td>{c.dataset_label}</td><td>{failure?'Помилка оновлення: '+failure.error:c.status==='error'?c.last_error||c.status_label:c.status_label}</td><td>{when(c.last_sync_at)}</td><td>{monValue(c.row_count)}</td><td className="mon-actions">{bosCan('write')&&c.kind==='google_sheets'&&<Button disabled={busy} onClick={()=>doSync(c.id)}>Оновити</Button>}{bosCan('write')&&<Button disabled={busy} onClick={()=>doDisable(c.id)}>Вимкнути</Button>}</td></tr>;})}</tbody></table></div>:<p className="op-muted mon-empty">Ще нічого не підключено</p>}
  </section>
  {open&&<section className="mon-card"><header><h2>{open.name}</h2><span>{open.row_count}</span></header><div className="erp-table"><table><thead><tr>{open.columns.map((c,i)=><th key={i}>{c}</th>)}</tr></thead><tbody>{open.rows.slice(0,100).map((r,i)=><tr key={i}>{r.map((v,j)=><td key={j}>{v}</td>)}</tr>)}</tbody></table></div><Button onClick={()=>setOpen(null)}>Закрити</Button></section>}
  {bosCan('write')&&<section className="mon-card"><header><h2>Нове підключення</h2></header>
   <div className="erp-form">
    <label>Сервіс<Select value={form.kind} onChange={e=>{setForm(p=>({...p,kind:e.target.value}));setPreview(null);}}><option value="csv">Excel / CSV</option><option value="google_sheets">Google Таблиці</option></Select></label>
    <label>Назва<Input value={form.name} maxLength={120} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Замовлення з магазину"/></label>
    <label>Дані<Select value={form.dataset} onChange={e=>setForm(p=>({...p,dataset:e.target.value}))}><option value="orders">Замовлення</option><option value="payments">Оплати</option><option value="stock">Залишки</option><option value="calls">Дзвінки</option><option value="other">Інше</option></Select></label>
    {form.kind==='csv'?<label>Файл .xlsx або .csv<input ref={fileRef} type="file" accept=".xlsx,.csv" onChange={()=>setPreview(null)}/></label>:<label>Посилання на таблицю<Input value={form.url} onChange={e=>{setForm(p=>({...p,url:e.target.value}));setPreview(null);}} placeholder="https://docs.google.com/spreadsheets/d/…"/></label>}
   </div>
   <div className="erp-actions"><Button disabled={busy} onClick={doPreview}>Переглянути</Button>{preview&&<Button variant="primary" disabled={busy||!form.name.trim()} onClick={doCreate}>Підключити</Button>}</div>
   {preview&&<div className="erp-table"><p className="op-muted">Рядків: {preview.row_count}</p><table><thead><tr>{preview.columns.map((c,i)=><th key={i}>{c}</th>)}</tr></thead><tbody>{preview.rows.map((r,i)=><tr key={i}>{r.map((v,j)=><td key={j}>{v}</td>)}</tr>)}</tbody></table></div>}
  </section>}
  <section className="mon-card"><header><h2>Сервіси</h2></header>
   <div className="mon-catalog">{data.catalog.map(x=><div key={x.kind} className="mon-service"><strong>{x.title}</strong><span>{x.group}</span><p>{x.gives}</p><em data-state={x.state}>{x.state==='available'?'Працює':'Готується'}</em></div>)}</div>
  </section>
 </div>;
}

// BoS 4 first screen: three short cases, one button into the demo. No login, no long text.
function Showcase({onEnter,busy,error,login}){
 const [data,setData]=useState(null),[active,setActive]=useState(0),[step,setStep]=useState(0);
 useEffect(()=>{fetch('/api/erp/showcase/').then(r=>r.json()).then(setData).catch(()=>setData({cases:[]}));},[]);
 const cases=data?.cases||[],current=cases[active],steps=current?.steps||[];
 const pick=i=>{setActive(i);setStep(0);};
 const move=d=>setStep(s=>Math.max(0,Math.min(steps.length-1,s+d)));
 return <main className="show" onKeyDown={e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);}}>
  <header className="show-head"><div className="show-brand"><BosMark/><strong>BoS</strong></div><span>{data?.company||''}</span></header>
  <section className="show-hero"><h1>Уся компанія в одному моніторингу</h1><p>Підключіть сервіси, якими вже користуєтесь, і бачте замовлення, склад, оплати й доручення в одних таблицях.</p>
   <button type="button" className="show-cta" disabled={busy} onClick={onEnter}>{busy?'Відкриваємо…':'Перейти до BoS'}</button>{error&&<p role="alert" className="show-error">{error}</p>}</section>
  {cases.length>0&&<section className="show-cases" aria-label="Кейси">
   <div className="show-tabs" role="tablist">{cases.map((c,i)=><button key={c.key} type="button" role="tab" aria-selected={i===active} onClick={()=>pick(i)}><span>{i+1}</span>{c.title}</button>)}</div>
   <div className="show-case" role="tabpanel">
    <div className="show-case-head"><p>{current.summary}</p><div className="show-result"><strong>{current.result.value}</strong><span>{current.result.label}</span></div></div>
    <ol className="show-steps">{steps.map((s,i)=><li key={i}><button type="button" aria-current={i===step?'step':undefined} data-done={i<step} onClick={()=>setStep(i)}><span>{i+1}</span><strong>{s.title}</strong><em>{s.text}</em></button></li>)}</ol>
    <div className="show-nav"><button type="button" onClick={()=>move(-1)} disabled={step===0}>Назад</button><span>{step+1} / {steps.length}</span><button type="button" onClick={()=>step===steps.length-1?pick((active+1)%cases.length):move(1)}>{step===steps.length-1?'Наступний кейс':'Далі'}</button></div>
   </div>
  </section>}
  {login&&<details className="show-login"><summary>Вхід для компанії</summary>{login}</details>}
 </main>;
}

function AuthGate(){
  const [ready,setReady]=useState(false),[mode,setMode]=useState(null),[trainingEnabled,setTrainingEnabled]=useState(false),[busy,setBusy]=useState(true),[error,setError]=useState('');
  const defaultCase=bos3Registry()?.cases[0]?.slug||null;
  const [username,setUsername]=useState(''),[password,setPassword]=useState(''),[selectedCase,setSelectedCase]=useState(()=>bos3Slug()||defaultCase),signInRef=useRef(null);
  const selectedDefinition=bos3Registry()?.cases.find(item=>item.slug===selectedCase)||null;
  const preserveSelectedCase=()=>{if(trainingEnabled&&selectedCase)bos3SetSlug(selectedCase,true);};
  const entryScroll=node=>{if(!node)return;node.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});(node.querySelector('input')||node).focus({preventScroll:true});};
  const openSignIn=()=>{preserveSelectedCase();entryScroll(signInRef.current);};
  const exploreBrochure=slug=>{if(slug&&bos3Registry()?.cases.some(item=>item.slug===slug)){setSelectedCase(slug);bos3SetSlug(slug);}requestAnimationFrame(()=>entryScroll(document.getElementById('bos3-entry-cases')||signInRef.current));};
  useEffect(()=>{const syncSelectedCase=()=>setSelectedCase(bos3Slug()||bos3Registry()?.cases[0]?.slug||null);window.addEventListener('popstate',syncSelectedCase);return()=>window.removeEventListener('popstate',syncSelectedCase);},[]);
  const openWorkspace=async()=>{
    const r=await fetch('/api/operations/status/');const d=await r.json();
    if(!r.ok||!d.authenticated)throw Error(d.error||'Увійдіть до BoS.');
    window.BOS_RUNTIME=d;setTrainingEnabled(d.training_enabled===true);setPassword('');setReady(true);
  };
  const bootstrap=async()=>{
    setBusy(true);setError('');
    try{const r=await fetch('/api/auth/csrf/');if(!r.ok)throw Error('Не вдалося відкрити BoS.');const d=await r.json();setMode(d.mode);setTrainingEnabled(d.training_enabled===true);
      const session=await fetch('/api/auth/me/');if(session.ok)await openWorkspace();else if(session.status!==401){const e=await session.json();setError(e.error||'Доступ не надано.');}
    }catch(e){setError(e.message);}finally{setBusy(false);}
  };
  useEffect(()=>{bootstrap();const expired=()=>{window.BOS_RUNTIME=null;setReady(false);setPassword('');setError('Сесію або права доступу змінено. Увійдіть знову.');};window.addEventListener('bos:session-ended',expired);return()=>window.removeEventListener('bos:session-ended',expired);},[]);
  const enter=async(demo=false)=>{
    if(busy)return;if(demo&&trainingEnabled){setError('Для навчальної інсталяції потрібен персональний логін і пароль.');return;}setBusy(true);setError('');
    try{const r=await fetch(demo?'/api/auth/demo/':'/api/auth/login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(demo?{role:'ceo'}:{username,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Не вдалося увійти.');await openWorkspace();}
    catch(e){setError(e.message);}finally{setBusy(false);}
  };
  const passwordForm=<form className="bos-auth-form" onSubmit={e=>{e.preventDefault();preserveSelectedCase();enter(false);}}>
    <label>Логін<Input autoComplete="username" value={username} onChange={e=>setUsername(e.target.value)} required disabled={busy}/></label>
    <label>Пароль<Input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} required disabled={busy}/></label>
    <Button type="submit" variant="primary" disabled={busy}>{busy?'Зачекайте…':'Увійти'}</Button>
  </form>;
  const entryPasswordForm=<form className="bos-light-login-form" onSubmit={event=>{event.preventDefault();preserveSelectedCase();enter(false);}}><label>Логін<input autoComplete="username" value={username} onChange={event=>setUsername(event.target.value)} required disabled={busy}/></label><label>Пароль<input type="password" autoComplete="current-password" value={password} onChange={event=>setPassword(event.target.value)} required disabled={busy}/></label><button type="submit" disabled={busy}>{busy?'Зачекайте…':'Увійти'}</button></form>;
  if(ready)return <App/>;
  if(trainingEnabled)return <main className="bos-entry-shell"><BosOnlineBrochure content={bos3Registry()} onExplore={exploreBrochure} onSignIn={openSignIn}/><Bos3Brochure entry selectedSlug={selectedCase} onSelectCase={setSelectedCase} onRequestSignIn={openSignIn} showBrochurePdf={false}/><section className="bos-light-login" ref={signInRef} aria-labelledby="bos-sign-in"><div className="bos-light-login-inner"><p className="bos3-kicker">Персональний доступ</p><h2 id="bos-sign-in">{selectedDefinition?'Продовжити: '+selectedDefinition.title:'Увійти до навчальної BoS'}</h2><p>{selectedDefinition?'Обраний сценарій відкриється у вашій навчальній сесії.':'Увійдіть, щоб відкрити доступні вашій ролі джерела.'}</p>{entryPasswordForm}{error&&<p role="alert" style={{color:'#B42318',fontSize:14,lineHeight:1.5,marginTop:16}}>{error}</p>}{!mode&&!busy&&<button className="bos-light-button" type="button" onClick={bootstrap} style={{marginTop:14}}>Повторити підключення</button>}</div></section></main>;
  if(mode==='demo'&&!trainingEnabled)return <Showcase onEnter={()=>enter(true)} busy={busy} error={error} login={passwordForm}/>;
  return <main className="bos-entry-shell"><div className="bos-login-standalone" ref={signInRef}>
    <section className="bos-auth-shell" aria-labelledby="bos-sign-in">
      <div style={{color:T.primary,fontWeight:800,fontSize:28,marginBottom:12}}>BoS</div>
      <h1 id="bos-sign-in" style={{fontSize:22,color:T.text,marginBottom:10}}>Увійти до робочого простору</h1>
      <p className="bos-auth-intro">Ваші дані та доступні дії визначає обліковий запис.</p>
      {mode==='demo'&&!trainingEnabled?<><Button variant="primary" onClick={()=>enter(true)} disabled={busy} style={{width:'100%'}}>{busy?'Зачекайте…':'Відкрити навчальну компанію'}</Button>
        <p className="op-muted">Навчальний вхід не потребує логіна чи пароля. Він надає бізнес-права керівника лише у навчальних даних, а не технічний або адміністративний доступ.</p>
        <Bos3Brochure compact onSelectCase={slug=>bos3SetSlug(slug)}/><a className="bos-start-pdf" href="/help/start.pdf">Пам’ятка входу й першої перевірки (PDF)</a>
        <details className="bos-auth-secondary"><summary>Увійти з логіном і паролем</summary>{passwordForm}</details>
      </>:passwordForm}
      {error&&<p role="alert" style={{color:T.red,fontSize:14,lineHeight:1.5,marginTop:16}}>{error}</p>}
      {!mode&&!busy&&<Button onClick={bootstrap} style={{marginTop:14}}>Повторити підключення</Button>}
    </section>
  </div></main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><AuthGate/></ErrorBoundary>);
{% endverbatim %}
</script>
</body>
</html>
