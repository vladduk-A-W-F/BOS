<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#F4F6F3;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(25,51,45,0.15);border-radius:4px}
input::placeholder,textarea::placeholder{color:rgba(25,51,45,0.25)}
select option{background:#FFFFFF}
/* Windows-like hover: лёгкое увеличение интерактивных элементов + плавность.
   Inline border-radius в JSX сильнее этого базового — правило страхует только кнопки без радиуса. */
button,select{border-radius:10px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
button:hover:not(:disabled),select:hover{transform:scale(1.05)}
button:active:not(:disabled){transform:scale(0.96)}
/* Примитивы Button/SegmentedControl: hover = зміна фону/яскравості, БЕЗ глобального scale (§7 — один ефект).
   Специфічність .класс:hover:not() вища за button:hover:not() — transform:none перемагає без !important */
.ui-btn:hover:not(:disabled){transform:none;background:rgba(25,51,45,0.07);filter:brightness(1.1)}
.seg-item{background:transparent;text-align:left}
.seg-item:hover:not(:disabled){transform:none;background:rgba(25,51,45,0.06)}
/* Плитки дашборда: hover = scale + осветление + контурная линия (конституция §7a).
   filter вместо background — фон KPI-плитки задаёт TONE_BG[tone] (зелёный/жовтий/
   червоний за планом), подмена фона стёрла бы индикацию статуса.
   box-shadow вместо border-color — border прописан инлайн в JSX, инлайн сильнее класса.
   z-index — иначе увеличенная плитка уходит под соседние. */
.dash-tile{position:relative;
  transition:transform .3s ease, filter .3s ease, box-shadow .3s ease}
.dash-tile:hover{transform:scale(1.03); filter:brightness(1.14);
  box-shadow:0 0 0 1px rgba(25,51,45,0.16); z-index:5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(102,126,234,0.4)}50%{box-shadow:0 0 0 5px rgba(102,126,234,0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* Вертолёт: пульс красного светофора — «здесь пожар» должен считываться периферией */
@keyframes heliPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.45)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
/* ── Aurora-слой: субтильні золото/індиго радіали за контентом, повільний дрейф (§3) ──
   inset:-20% — щоб дрейф не оголював краї; z-index:-1 — за контентом; GPU: transform/opacity */
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 85% -10%, rgba(245,180,0,0.04) 0%, transparent 45%),
    radial-gradient(ellipse at -10% 110%, rgba(99,102,241,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 110% 95%, rgba(245,180,0,0.02) 0%, transparent 40%);
  animation:auroraDrift 50s ease-in-out infinite alternate;
  will-change:transform,opacity}
@keyframes auroraDrift{
  from{transform:translate(0,0) scale(1);opacity:.8}
  to{transform:translate(2%,3%) scale(1.06);opacity:1}}
/* ── Верхняя навигация: icon-пилюли с hover-раскрытием ──
   Раскрывается сам СЛОТ (пилюля width:100% следует за ним) — соседи плавно
   расступаются, никто никого не перекрывает (выбор Ника, ТЗ №2). */
.nav-slot{position:relative;width:44px;height:44px;flex-shrink:0;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.nav-slot:hover{width:132px;z-index:60}
.nav-pill{position:relative;width:100%;height:44px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;appearance:none;cursor:pointer;overflow:hidden;
  background:rgba(25,51,45,0.04);border:1px solid rgba(25,51,45,0.09);color:rgba(25,51,45,0.6);
  transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease}
/* Раскрытая пилюля — стекло с mint-акцентом (граница), не сплошная зелёная заливка */
.nav-slot:hover .nav-pill{background:rgba(25,51,45,0.10);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-color:rgba(25,51,45,0.14);color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,0.4)}
/* Активний розділ — нейтральна поверхня; єдиний акцент — тонка золота смужка знизу */
.nav-pill.active{background:rgba(25,51,45,0.08);border-color:rgba(25,51,45,0.12);color:#19332D}
.nav-pill.active::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:16px;height:2px;border-radius:2px;background:#f5b400}
.nav-pill-icon{display:flex;align-items:center;justify-content:center;transition:transform .22s ease,opacity .18s ease}
.nav-slot:hover .nav-pill-icon{transform:scale(0);opacity:0}
.nav-pill-label{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-size:13px;font-weight:700;color:#19332D;
  opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.nav-slot:hover .nav-pill-label{opacity:1;transform:scale(1);transition-delay:.12s}
/* Индикаторы на углу слота (badge HR, online-точка AI) — прячутся на hover, чтобы не мешать подписи */
.nav-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:rgba(25,51,45,0.12);color:#19332D;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:2;border:2px solid #F4F6F3;transition:opacity .2s}
/* Online-точка AI — индиго (фирменный цвет AI) */
.nav-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#6366f1;
  border:2px solid #F4F6F3;pointer-events:none;z-index:2;transition:opacity .2s}
.nav-slot:hover .nav-badge,.nav-slot:hover .nav-dot{opacity:0}
/* Dropdown под-пунктов открывается только явным действием на trigger. */
.nav-dropdown{position:absolute;top:calc(100% + 10px);left:50%;min-width:210px;padding:6px;border-radius:14px;
  background:rgba(21,23,27,0.92);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(25,51,45,0.1);box-shadow:0 16px 44px rgba(0,0,0,0.55);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-6px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s;z-index:70}
.nav-dropdown.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.nav-dropdown[hidden]{display:none}
.nav-drop-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;box-sizing:border-box;border:0;border-radius:9px;cursor:pointer;text-align:left;background:transparent;
  color:rgba(25,51,45,0.65);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.nav-drop-item:hover{background:rgba(25,51,45,0.07);color:#fff}
/* Активний під-пункт: нейтральна поверхня, золото лише текстом (інакше не відрізнити від hover) */
.nav-drop-item.active{background:rgba(25,51,45,0.08);color:#f5b400;font-weight:600}
/* ── Hover карточки: ОДИН стриманий ефект — легкий підйом + м'яка тінь (конституція §7) ──
   !important лишається ТІЛЬКИ на box-shadow: окремі картки задають тінь інлайн (boxShadow в override cardS) */
.living-card{transition:transform .2s ease, box-shadow .2s ease}
.living-card:hover{transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(0,0,0,0.45) !important}
/* Markdown styling for AI chat bubbles */
.ai-md p { margin: 0 0 8px; }
.ai-md p:last-child { margin-bottom: 0; }
.ai-md ul, .ai-md ol { margin: 6px 0 6px 18px; padding: 0; }
.ai-md li { margin: 3px 0; }
.ai-md strong { color: #19332D; font-weight: 600; }
.ai-md code { background: rgba(25,51,45,0.1); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

.network-tabs [aria-pressed=true],.network-groups [aria-pressed=true] { color:var(--bos-primary)!important; background:var(--bos-soft)!important; border-color:#9FC5AF!important; }
.network-workflow-metrics>div,.network-converted>div { background:#FFFFFF; border-color:var(--bos-line); border-radius:12px; }
.network-workflow-metrics span,.network-converted span { color:var(--bos-muted); }
.network-groups,.network-comparison { border-color:var(--bos-line); }
.bos-settings>div { gap:22px!important; }
.bos-settings-label { display:flex; align-items:center; gap:8px; }
.bos-settings-label>span { display:flex; flex-shrink:0; }
.bos-settings-advanced { flex-basis:100%; }
.bos-settings-advanced>summary { cursor:pointer; margin-bottom:12px; }
.bos-settings-advanced>label { display:inline-flex; flex-direction:column; gap:6px; margin:0 14px 12px 0; }
.bos-settings,.bos-tasks,.bos-employees,.bos-bank,.bos-contracts,.bos-contractors,.bos-salaries,.bos-reports,.bos-schedule,.bos-notes { max-width:1600px; margin-inline:auto; }
@container workspace (max-width:950px) {
  .erp-metrics,.bos-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .bos3-runner-grid,.bos3-hero,.crm-layout,.network-overview { grid-template-columns:1fr; }
  .bos3-case-grid { grid-template-columns:1fr; }
}
@media(max-width:1200px) {
  .bos-navbar { min-height:68px; }
  .bos-nav-tools { gap:8px!important; }
  .bos-ai-panel { top:104px!important; background:#FAFCF8!important; }
}
@media(max-width:760px) {
  button,select,[role=button] { min-height:44px; }
  input:not([type=checkbox]):not([type=radio]),select,textarea { font-size:16px!important; }
  .op-mode { padding:4px 14px; gap:4px 10px; min-height:36px; }
  .op-mode>span:first-child { flex:1; min-width:140px; font-size:10px; }
  .op-mode button { min-height:30px; }
  .bos-navbar { padding:10px 14px!important; gap:8px; min-height:70px; }
  .bos-brand { padding:0; }
  .bos-mark { width:36px; height:36px; border-radius:10px; }
  .bos-mobile-nav { flex:1; max-width:none; width:100%; margin:0; min-width:0; padding:8px; }
  .bos-nav-tools { gap:6px!important; }
  .bos-nav-tools button { width:44px!important; height:44px!important; }
  .bos-nav-tools>div[title] { display:none; }
  .bos-topbar { padding:18px 16px!important; gap:12px!important; min-height:0; }
  .bos-page-title>div:first-child { font-size:22px!important; }
  .bos-search { order:3; min-width:0; max-width:none; flex-basis:100%; }
  .bos-search input { font-size:16px; }
  .bos-topbar>.ui-btn { padding:10px 12px!important; font-size:12px!important; }
  .erp-workspace,.bos-home { padding:20px 16px; gap:18px; }
  .erp-workspace h2,.bos-home h1 { font-size:24px; }
  .erp-metrics,.bos-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .bos-kpi { padding:15px; }
  .bos-dialog { padding:20px; border-radius:14px; }
  .bos-dialog h2 { font-size:21px; }
  .bos-dialog .actions { flex-wrap:wrap; }
  .bos-dialog .actions button { flex:1 1 auto; }
  .bos-settings>div { flex-direction:column; }
  .bos-settings>div>div:first-child { width:100%!important; flex-direction:row!important; }
  .bos-settings>div>div:last-child { width:100%; }
  .bos-settings,.bos-tasks,.bos-employees,.bos-bank,.bos-contracts,.bos-contractors,.bos-salaries,.bos-reports,.bos-schedule,.bos-notes { padding:20px 16px!important; }
  .bos-ai-panel { top:106px!important; }
  .module-view-switch { width:100%; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}

/* BoS 3.0 learning, entry and CRM light workspace layer. Append after bos-design.css. */

/* Shared type, controls and light application canvas. */
.bos-entry-shell,.bos3-start,.bos3-runner,.crm-workspace{
  color:var(--bos-ink);
  font-family:var(--bos-font,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif);
}
.bos3-start,.bos3-runner,.crm-workspace{
  max-width:1240px;
  padding:32px;
  gap:24px;
}
.bos3-start h1,.bos3-runner h1,.crm-workspace h1,
.bos3-start h2,.bos3-runner h2,.crm-workspace h2,
.bos3-start h3,.bos3-runner h3,.crm-workspace h3{color:var(--bos-ink)}
.bos3-kicker{
  color:var(--bos-primary);
  font-size:11px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.bos3-note,.bos3-section-heading p,.bos3-runner-header p,.crm-heading p{color:var(--bos-muted)}
.bos3-actions .ui-btn,.bos3-step-actions .ui-btn{
  min-height:42px;
  border-radius:var(--bos-radius-control);
  font-weight:700;
}
.bos3-actions .ui-btn:hover,.bos3-step-actions .ui-btn:hover{filter:brightness(.96)}
.bos3-area:focus-visible,.bos3-case-link:focus-visible,.bos3-tour-control:focus-visible,
.bos-preview-case:focus-visible,.bos-preview-stage:focus-visible,
.crm-list button:focus-visible,.crm-form input:focus-visible,.crm-form textarea:focus-visible,
.crm-form select:focus-visible,.bos-light-login-form input:focus-visible,.bos-light-login-form button:focus-visible{
  outline:3px solid rgba(49,95,173,.55);
  outline-offset:3px;
}

/* Entry: quiet editorial opening with a useful object-window and three numbered choices. */
.bos-entry-shell{
  min-height:100vh;
  background:
    radial-gradient(circle at 88% 4%,rgba(18,107,85,.10),transparent 25rem),
    linear-gradient(180deg,#F9FBF8 0,#F4F6F3 48%,#EDF3EE 100%);
}
.bos-entry-shell .bos3-start{max-width:1240px;padding-top:42px}
.bos-entry-shell .bos3-kicker{margin-bottom:12px}
.bos-preview-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:32px;
  align-items:center;
  padding:0 0 34px;
  border-bottom:1px solid var(--bos-line);
}
.bos-preview-head h1{
  max-width:760px;
  margin:0;
  font-size:clamp(34px,4vw,48px);
  line-height:1.04;
  letter-spacing:-.045em;
  font-weight:760;
}
.bos-preview-head p{
  max-width:640px;
  margin:18px 0 0;
  color:var(--bos-muted);
  font-size:17px;
  line-height:1.6;
}
.bos-preview-object{
  display:block;
  width:220px;
  height:160px;
  object-fit:cover;
  object-position:right center;
  border:1px solid #CFE0D5;
  border-radius:var(--bos-radius-card);
  box-shadow:var(--bos-shadow);
}
.bos-preview-icon{color:var(--bos-primary)}
.bos-preview-cases{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.bos-preview-case{
  position:relative;
  min-height:148px;
  padding:22px 18px 18px 60px;
  border:1px solid var(--bos-line);
  border-radius:var(--bos-radius-card);
  background:rgba(255,255,255,.82);
  color:var(--bos-ink);
  box-shadow:0 1px 0 rgba(25,51,45,.02);
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
.bos-preview-case::before{
  position:absolute;
  top:18px;
  left:18px;
  display:grid;
  width:27px;
  height:27px;
  place-items:center;
  border-radius:50%;
  background:var(--bos-soft);
  color:var(--bos-primary);
  font-size:12px;
  font-weight:800;
  content:counter(bos-case);
  counter-increment:bos-case;
}
.bos-preview-cases{counter-reset:bos-case}
.bos-preview-case:hover,.bos-preview-case[aria-current=true]{
  border-color:#75A995;
  background:#fff;
  box-shadow:var(--bos-shadow);
  transform:translateY(-2px);
}
.bos-preview-case[aria-current=true]::before{background:var(--bos-primary);color:#fff}
.bos-preview-case strong{display:block;color:var(--bos-ink);font-size:16px;line-height:1.35}
.bos-preview-case span{display:block;margin-top:8px;color:var(--bos-muted);font-size:13px;line-height:1.45}
.bos-preview-window{
  overflow:hidden;
  border:1px solid var(--bos-line);
  border-radius:var(--bos-radius-card);
  background:var(--bos-surface);
  box-shadow:var(--bos-shadow);
}
.bos-preview-window-bar{
  display:flex;
  align-items:center;
  min-height:48px;
  padding:0 20px;
  border-bottom:1px solid var(--bos-line);
  background:#FBFCFA;
}
.bos-preview-window-bar strong{font-size:13px;color:var(--bos-muted)}
.bos-preview-window-body{padding:26px}
.bos-preview-title{display:flex;align-items:start;justify-content:space-between;gap:20px;padding-bottom:20px}
.bos-preview-title h2{margin:0;font-size:24px;letter-spacing:-.025em}
.bos-preview-title p{margin:7px 0 0;color:var(--bos-muted);line-height:1.5}
.bos-preview-badge,.bos3-capability,.bos3-status,.bos3-source-list span{
  border:1px solid #BCD8C7;
  border-radius:999px;
  background:var(--bos-soft);
  color:#285647;
  font-weight:700;
}
.bos-preview-facts{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.crm-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bos-preview-fact,.crm-facts>div{
  min-width:0;
  padding:14px;
  border:1px solid var(--bos-line);
  border-radius:12px;
  background:#FAFCF9;
}
.bos-preview-fact:first-child{border-inline-start:3px solid var(--bos-primary)}
.bos-preview-fact:last-child{border-inline-start:3px solid var(--bos-amber)}
.bos-preview-fact span,.crm-facts span{display:block;color:var(--bos-muted);font-size:12px;line-height:1.35}
.bos-preview-fact strong,.crm-facts strong{display:block;margin-top:7px;color:var(--bos-ink);font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.bos-preview-source{
  margin-top:12px;
  padding:15px 16px;
  border:1px solid var(--bos-line);
  border-radius:12px;
  background:#fff;
}
.bos-preview-source:last-of-type{border-color:#C8DED0;background:#F8FCF8}
.bos-preview-source h3,.bos-preview-detail h3{margin:0;color:var(--bos-ink);font-size:15px}
.bos-preview-source p,.bos-preview-detail p{margin:7px 0 0;color:var(--bos-muted);font-size:14px;line-height:1.5}
.bos-preview-path{margin-top:24px}
.bos-preview-path h3{margin:0 0 10px;font-size:16px}
.bos-preview-path-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:16px;align-items:start}
.bos-preview-stage{
  display:grid;
  grid-template-columns:30px minmax(0,1fr) auto;
  column-gap:11px;
  align-items:center;
  padding:14px 0;
  border:0;
  border-bottom:1px solid var(--bos-line);
  border-radius:0;
  background:transparent;
  color:var(--bos-ink);
  text-align:left;
}
.bos-preview-stage:last-child{border-bottom:0}
.bos-preview-stage[aria-pressed=true]{padding-inline:12px;border-radius:10px;background:var(--bos-soft);border-bottom-color:transparent}
.bos-preview-stage-index{
  display:grid;
  width:28px;
  height:28px;
  place-items:center;
  border:1px solid #AFC8BA;
  border-radius:50%;
  color:var(--bos-primary);
  font-size:12px;
  font-weight:800;
}
.bos-preview-stage[aria-pressed=true] .bos-preview-stage-index{background:var(--bos-primary);border-color:var(--bos-primary);color:#fff}
.bos-preview-stage strong{color:var(--bos-ink);font-size:14px}.bos-preview-stage span,.bos-preview-stage small{color:var(--bos-muted);font-size:12px;line-height:1.45}
.bos-preview-detail{padding:18px;border:1px solid #C8DED0;border-radius:12px;background:#F8FCF8}
.bos-preview-next{margin-top:16px;padding-top:16px;border-top:1px solid var(--bos-line)}
.bos-entry-shell .bos3-section-heading{padding-top:10px}.bos-entry-shell .bos3-section-heading h2{font-size:25px;letter-spacing:-.025em}
.bos-entry-shell .bos3-area-grid{gap:12px}.bos-entry-shell .bos3-area{
  min-height:0;
  padding:18px;
  border:1px solid var(--bos-line);
  border-radius:var(--bos-radius-card);
  background:var(--bos-surface);
  color:var(--bos-ink);
}
.bos-entry-shell .bos3-area:hover:not(:disabled),.bos-entry-shell .bos3-area[aria-pressed=true]{border-color:#75A995;background:#F8FCF8;box-shadow:0 6px 18px rgba(25,51,45,.06)}
.bos-entry-shell .bos3-area p,.bos-entry-shell .bos3-area small{color:var(--bos-muted)}
.bos-entry-shell .bos3-area-result{border-color:#B9D8C4;background:var(--bos-soft);color:#285647;border-radius:10px}.bos-entry-shell .bos3-area-result strong{color:var(--bos-primary)}

/* Entry sign-in closes the brochure with a calm, clearly separate action panel. */
.bos-light-login{padding:40px 32px 54px;background:#EAF1EC;border-top:1px solid #D6E1D9}
.bos-light-login-inner{max-width:760px;margin:0 auto;padding:28px;border:1px solid #CFE0D5;border-radius:var(--bos-radius-card);background:#fff;box-shadow:var(--bos-shadow)}
.bos-light-login h2{margin:0;font-size:26px;letter-spacing:-.025em;color:var(--bos-ink)}
.bos-light-login p{color:var(--bos-muted);line-height:1.55}.bos-light-login-form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:20px}
.bos-light-login-form label{display:grid;gap:6px;color:var(--bos-muted);font-size:12px;font-weight:700}
.bos-light-login-form input,.bos3-answer-form input,.crm-form input,.crm-form textarea,.crm-form select{
  box-sizing:border-box;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  border:1px solid #BFCFC5;
  border-radius:var(--bos-radius-control);
  background:#fff;
  color:var(--bos-ink);
  font:inherit;
}
.bos-light-login-form button{min-height:44px;padding:0 18px;border:1px solid var(--bos-primary);border-radius:var(--bos-radius-control);background:var(--bos-primary);color:#fff;font:inherit;font-weight:750;cursor:pointer}
.bos-light-login-form button:disabled{opacity:.58;cursor:wait}

/* The entry header has the real BoS mark and a two-line brand lock-up. */
.bos-light-header{border-color:var(--bos-line);font-family:var(--bos-font,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif)}
.bos-light-brand{align-items:center;color:var(--bos-ink);gap:10px}
.bos-light-brand .bos-mark{display:inline-flex;align-items:center;color:#FFFFFF;line-height:1}
.bos-light-brand>span:not(.bos-mark){display:flex;flex-direction:column;gap:2px;line-height:1.1}
.bos-light-brand small{display:block;color:var(--bos-muted);font-size:11px;font-weight:650;letter-spacing:0}

/* In-app training hub and runner. */
.bos3-hero{padding:8px 0 26px;border-color:var(--bos-line)}
.bos3-hero h1{font-size:clamp(34px,4vw,50px);letter-spacing:-.04em}.bos3-hero p{color:var(--bos-muted)}
.bos3-hero-aside{border-color:var(--bos-primary);color:var(--bos-muted)}.bos3-hero-aside strong{color:var(--bos-ink)}
.bos3-area,.bos3-case-link,.bos3-side-card,.bos3-steps{
  border-color:var(--bos-line);
  border-radius:var(--bos-radius-card);
  background:var(--bos-surface);
  color:var(--bos-ink);
}
.bos3-area{min-height:172px;padding:18px}.bos3-area strong,.bos3-case-link h3{color:var(--bos-ink)}.bos3-area p,.bos3-area small,.bos3-case-link p{color:var(--bos-muted)}
.bos3-area:hover:not(:disabled),.bos3-area[aria-pressed=true],.bos3-case-link:hover{border-color:#75A995;background:#F8FCF8;box-shadow:var(--bos-shadow)}
.bos3-case-grid{gap:14px}.bos3-case-link{min-height:230px;padding:20px}.bos3-case-code{color:var(--bos-primary);font-weight:800}.bos3-case-meta span{border-color:#C7D9CC;border-radius:999px;color:#49645A;background:#F8FCF8}
.bos3-status{background:#F5FAF6;color:#285647;border-color:#BCD8C7}.bos3-status[data-status=completed]{background:#E8F3EB;color:#1F6340;border-color:#8DBDA0}.bos3-status[data-status=paused],.bos3-status[data-status=needs_recheck],.bos3-status[data-status=needs_recheck_after_source_change]{background:#FFF7E9;color:#87520E;border-color:#E2BD79}.bos3-status[data-status=unavailable]{background:#FEF2F1;color:#A33A33;border-color:#E7B8B3}
.bos3-runner-header{padding-bottom:22px;border-color:var(--bos-line)}.bos3-runner-header h1{font-size:32px;letter-spacing:-.03em}.bos3-runner-header p{color:var(--bos-muted)}
.bos3-steps{padding:4px 20px;box-shadow:0 2px 10px rgba(25,51,45,.035)}
.bos3-step{border-color:var(--bos-line)}.bos3-step-index{border-color:#B8CBC0;color:var(--bos-muted);background:#fff}.bos3-step[data-current=true] .bos3-step-index{border-color:var(--bos-primary);background:var(--bos-primary);color:#fff}.bos3-step[data-status=completed] .bos3-step-index{border-color:#86B69A;background:var(--bos-soft);color:#1F6340}
.bos3-step h3{color:var(--bos-ink)}.bos3-step p,.bos3-step small{color:var(--bos-muted)}.bos3-evidence{border-color:#85B89A;background:#F2FAF4;color:#285647;border-radius:0 8px 8px 0}.bos3-evidence[data-passed=false]{border-color:#D3A759;background:#FFF7E8;color:#87520E}
.bos3-side-card{padding:20px;box-shadow:0 2px 10px rgba(25,51,45,.035)}.bos3-side-card h2{color:var(--bos-ink)}.bos3-side-card dt{color:var(--bos-muted)}.bos3-side-card dd{color:var(--bos-ink)}
.bos3-answer-form label{color:var(--bos-muted);font-weight:700}.bos3-answer-form input{border-color:#BFCFC5;background:#fff;color:var(--bos-ink)}
.bos3-tour{border-color:#B7CDDF;border-radius:var(--bos-radius-card);background:#F2F7FC}.bos3-tour h2{color:var(--bos-ink)}.bos3-tour p{color:#496678}.bos3-tour-index{color:var(--bos-blue)}
.bos3-empty{border-color:#B6C9BD;background:#F8FBF8;color:#49645A;border-radius:0 10px 10px 0}.bos3-source-list span{color:#49645A;background:#F8FCF8;border-color:#C7D9CC}

/* Data-backed chart only: the widths remain supplied by the training case. */
.bos-preview-chart{padding:18px 0;border-color:var(--bos-line)}
.bos-preview-chart h3{color:var(--bos-ink)}.bos-preview-chart>p,.bos-preview-chart-label{color:var(--bos-muted)}.bos-preview-chart-total{color:var(--bos-blue);font-weight:750}.bos-preview-chart-value{color:var(--bos-ink)}
.bos-preview-chart-track{height:8px;border-radius:999px;background:#E3ECE5}.bos-preview-chart-fill{border-radius:999px;background:var(--bos-blue)}.bos-preview-chart-fill[data-tone=green]{background:var(--bos-primary)}.bos-preview-chart-fill[data-tone=amber]{background:var(--bos-amber)}.bos-preview-chart-fill[data-tone=red]{background:#B73932}.bos-preview-chart-note{color:#7A5519}.bos-preview-chart-note .bos-preview-icon{color:var(--bos-amber)}

/* Auth retains the same visual language when opened outside the learning entry. */
.bos-auth-shell{max-width:560px;padding:32px;border-color:var(--bos-line);border-radius:var(--bos-radius-card);background:var(--bos-surface);box-shadow:var(--bos-shadow);color:var(--bos-ink)}
.bos-auth-shell h1,.bos-auth-form label{color:var(--bos-ink)}.bos-auth-intro,.bos-start-guide>p{color:var(--bos-muted)}.bos-auth-secondary{border-color:var(--bos-line)}.bos-auth-secondary summary{color:var(--bos-primary);font-weight:700}.bos-start-steps>div{border-color:#8DBFAE}.bos-start-steps strong{color:var(--bos-ink)}.bos-start-steps span{color:var(--bos-muted)}

/* CRM: scanable deal list, source facts, progressive form sections. */
.crm-workspace{gap:24px}.crm-heading{align-items:end;padding-bottom:22px;border-bottom:1px solid var(--bos-line)}.crm-heading h1{font-size:38px;letter-spacing:-.04em}.crm-heading p{max-width:700px;font-size:15px;line-height:1.6}
.crm-layout{grid-template-columns:minmax(270px,.72fr) minmax(0,1.6fr);gap:18px;align-items:start}.crm-list,.crm-detail{border-color:var(--bos-line);border-radius:var(--bos-radius-card);background:var(--bos-surface);box-shadow:0 2px 12px rgba(25,51,45,.035)}
.crm-list{padding:8px}.crm-list button{padding:15px;border-color:transparent;border-bottom-color:var(--bos-line);border-radius:10px;color:var(--bos-ink)}.crm-list button:hover{background:#F7FBF8}.crm-list button[aria-current=true]{border-color:#A9CCB7;background:var(--bos-soft);box-shadow:none}.crm-list button strong{color:var(--bos-ink)}.crm-list button span{color:var(--bos-muted)}

/* General monitoring stays above the scrollable workspace and uses guarded ERP facts. */
.bos-monitor { flex:0 0 auto; min-width:0; padding:14px 30px 10px; border-bottom:1px solid #C9DBCF; background:#EDF4EE; }

.bos-monitor-foot { display:flex; align-items:start; flex-wrap:wrap; gap:5px 16px; margin-top:7px; font-size:10px; color:#5B7063; }

@media(max-width:900px) {

/* Integration stylesheet for BosOnlineBrochure. Append after bos_design.css. */
.bos-online-brochure{
  --online-ink:#19332D;
  --online-muted:#60726B;
  --online-line:#DAE3DC;
  --online-green:#126B55;
  --online-soft:#E8F3EB;
  --online-blue:#315FAD;
  --online-amber:#A86614;
  max-width:1240px;
  margin:24px auto 0;
  overflow:hidden;
  border:1px solid var(--online-line);
  border-radius:20px;
  background:#fff;
  color:var(--online-ink);
  box-shadow:0 16px 42px rgba(25,51,45,.09);
  font-family:var(--bos-font,"Segoe UI",system-ui,sans-serif);
}
.bos-online-brochure:focus-visible{outline:3px solid rgba(49,95,173,.6);outline-offset:4px}

.bos-online-header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px;padding:12px 24px;border-bottom:1px solid var(--online-line);background:#FCFDFC}
.bos-online-brand{display:flex;align-items:center;gap:10px;padding:4px;border:0;background:transparent;color:var(--online-ink);font:inherit;font-size:20px;font-weight:780;line-height:1;text-align:left;cursor:pointer}
.bos-online-brand .bos-mark{display:inline-flex;color:#fff}
.bos-online-brand>span{display:flex;flex-direction:column;gap:3px}.bos-online-brand small{color:var(--online-muted);font-size:10px;font-weight:650;letter-spacing:.025em;text-transform:uppercase}
.bos-online-header>div{display:flex;align-items:center;gap:8px}.bos-online-header-link,.bos-online-header-signin{min-height:38px;padding:8px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--online-ink);font:inherit;font-size:13px;font-weight:720;cursor:pointer}.bos-online-header-signin{border-color:var(--online-green);background:var(--online-green);color:#fff}
.bos-online-header-link:hover{background:var(--online-soft);color:var(--online-green)}.bos-online-header-signin:hover,.bos-online-primary:hover{background:#0B5744}
.bos-online-progress{height:3px;background:#EDF2EE}.bos-online-progress i{display:block;height:100%;background:var(--online-green);transition:width .28s ease}
.bos-online-page-wrap{min-height:528px;padding:clamp(24px,4vw,52px)}
.bos-online-page{min-height:476px;animation:bos-online-page-in .32s cubic-bezier(.2,.8,.2,1) both}@keyframes bos-online-page-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.bos-online-spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.94fr);min-height:476px;gap:clamp(28px,5vw,72px);align-items:center}.bos-online-copy,.bos-online-story-intro,.bos-online-monitor>div:first-child,.bos-online-areas-copy,.bos-online-controls>div:first-child{min-width:0}
.bos-online-example{display:inline-flex;align-items:center;min-height:25px;padding:4px 8px;border:1px solid #BCD8C7;border-radius:999px;background:var(--online-soft);color:#285647;font-size:11px;font-weight:750;letter-spacing:.02em}
.bos-online-kicker{margin:15px 0 8px;color:var(--online-green);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.bos-online-page h2{max-width:680px;margin:0;color:var(--online-ink);font-size:clamp(34px,4.1vw,56px);font-weight:760;line-height:1.04;letter-spacing:-.052em}.bos-online-page h2 em{color:var(--online-green);font-style:normal}.bos-online-page h3{margin:0;color:var(--online-ink)}
.bos-online-lead{max-width:600px;margin:20px 0 0;color:var(--online-muted);font-size:17px;line-height:1.62}.bos-online-note{max-width:560px;margin:14px 0 0;color:#49645A;font-size:13px;line-height:1.55}

/* Page 1: a decorative but semantically labelled relation diagram. */
.bos-online-flow{position:relative;min-height:390px;overflow:hidden;border:1px solid #CFE0D5;border-radius:18px;background:linear-gradient(145deg,#F9FCF9,#E8F3EB)}
.bos-online-flow svg{position:absolute;inset:0;width:100%;height:100%}.bos-online-flow-line{fill:none;stroke:var(--online-green);stroke-width:2.5;stroke-dasharray:7 7;animation:bos-online-dash 3s linear 1}.bos-online-flow-line--muted{stroke:#789DD0;stroke-dasharray:4 8}@keyframes bos-online-dash{to{stroke-dashoffset:-168}}.bos-online-flow-dot{fill:var(--online-green);stroke:#fff;stroke-width:5}.bos-online-flow-dot--soft{fill:var(--online-blue)}
.bos-online-flow-node{position:absolute;display:flex;flex-direction:column;gap:3px;max-width:145px;padding:10px 11px;border:1px solid rgba(25,51,45,.12);border-radius:11px;background:rgba(255,255,255,.9);box-shadow:0 5px 13px rgba(25,51,45,.07)}.bos-online-flow-node b{font-size:13px}.bos-online-flow-node span{color:var(--online-muted);font-size:11px;line-height:1.35}.bos-online-flow-node--request{top:35px;left:20px}.bos-online-flow-node--source{top:155px;left:calc(50% - 69px)}.bos-online-flow-node--check{right:18px;bottom:29px}.bos-online-flow-node--owner{bottom:28px;left:20px}.bos-online-flow-node--result{top:35px;right:18px}

/* Page 2: actual supply numbers and handoffs from the registry. */
.bos-online-story-intro>p:not(.bos-online-kicker){margin:17px 0 0;color:var(--online-muted);line-height:1.6}.bos-online-story-intro h2{font-size:clamp(30px,3.3vw,46px)}.bos-online-story-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}.bos-online-story-facts>div{min-width:0;padding:11px;border:1px solid var(--online-line);border-radius:10px;background:#FAFCFA}.bos-online-story-facts span{display:block;color:var(--online-muted);font-size:11px;line-height:1.3}.bos-online-story-facts strong{display:block;margin-top:7px;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.bos-online-handoffs{padding:20px;border:1px solid var(--online-line);border-radius:16px;background:#FBFCFB}.bos-online-caption{margin:0 0 10px;color:var(--online-muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.bos-online-step-list{display:flex;flex-direction:column}.bos-online-step-list button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:46px;padding:8px 0;border:0;border-bottom:1px solid var(--online-line);background:transparent;color:var(--online-ink);font:inherit;text-align:left;cursor:pointer}.bos-online-step-list button:last-child{border-bottom:0}.bos-online-step-list button>span{display:grid;width:24px;height:24px;place-items:center;border:1px solid #B6CCC0;border-radius:50%;color:var(--online-muted);font-size:10px;font-weight:800}.bos-online-step-list button strong{font-size:13px;line-height:1.3}.bos-online-step-list button.is-active{color:var(--online-green)}.bos-online-step-list button.is-active>span{border-color:var(--online-green);background:var(--online-green);color:#fff}.bos-online-step-detail{margin-top:16px;padding:15px;border-left:3px solid var(--online-green);border-radius:0 10px 10px 0;background:var(--online-soft)}.bos-online-step-detail h3{font-size:15px}.bos-online-step-detail p{margin:7px 0;color:#285647;font-size:13px;line-height:1.48}.bos-online-step-detail small{display:block;color:#49645A;font-size:12px;line-height:1.45}
