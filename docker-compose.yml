services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bos_ci
      POSTGRES_PASSWORD: bos_synthetic_ci_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${BOS_PGPORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bos_ci -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
# Disposable synthetic database only. This is not a production deployment.
