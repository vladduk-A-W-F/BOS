Досліджуй лише картку. Спочатку статичні докази. Запуск дозволений лише після зняття поточної паузи та перевірки лімітів конкретної дії. PostgreSQL-твердження потребують PostgreSQL 16. Поверни факти, гіпотези, мінімальний сценарій та межі, без правок.
"""
