# BoS: project-local configuration; does not alter account permissions.
model = "gpt-6-astra"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[agents.bos_architect]
description = "Модель пов’язаного управління, межі та контракти даних"
config_file = "agents/bos_architect.toml"

[agents.bos_diagnostician]
description = "Доведення першопричини та мінімальне відтворення"
config_file = "agents/bos_diagnostician.toml"

[agents.bos_implementer]
description = "Мінімальна продуктова правка у виділеній копії"
config_file = "agents/bos_implementer.toml"

[agents.bos_test_ci]
description = "Тестова інфраструктура та повнота доказів"
config_file = "agents/bos_test_ci.toml"

[agents.bos_reviewer]
description = "Незалежна перевірка diff, поведінки та доказів"
config_file = "agents/bos_reviewer.toml"

[agents.bos_evidence]
description = "Походження доказів, контрольні суми та звіт"
config_file = "agents/bos_evidence.toml"

[agents.bos_ux]
description = "Пов’язані екрани та сценарії трьох ролей"
config_file = "agents/bos_ux.toml"

[agents.bos_readiness_auditor]
description = "Незалежне зіставлення 11 критеріїв на одному кандидатові"
config_file = "agents/bos_readiness_auditor.toml"

[agents.bos_pilot_pack]
description = "Паспорт пілота, сценарії та людські умови"
config_file = "agents/bos_pilot_pack.toml"

[agents.bos_release_packager]
description = "Підготовка точного пакета змін, перевірок і доказів для рішення root"
config_file = "agents/bos_release_packager.toml"
